# Hides the on-screen keyboard the way each platform lets a collector do it.
# Android: its own "hide keyboard" (the back key).
# iOS has no such key. A collector drags the list under the field (Search and the card pickers
# let go of the keyboard when a drag begins) or taps beside the fields of a form. So: a short drag
# in the middle of the screen, above the keyboard (a real drag: it scrolls, it never presses what
# it starts on), then, only while a keyboard is still on screen, a tap in the page's right padding
# at mid-height (inside the scrolling part of a form or of a conversation, above the keyboard).
# (Maestro's own hideKeyboard is not used on iOS: its flick in the middle of the screen is so
# short that it presses what is there, for example the "Forgot your password?" link of the
# sign-in screen. In a form dialog use hide-keyboard-in-dialog.yaml: beside a dialog there is
# only its backdrop.)
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 55%
          end: 50%, 45%
          duration: 400
      - runFlow:
          when:
            visible:
              id: 'UIKeyboardLayoutStar.*'
          commands:
            - tapOn:
                point: 98%, 50%
            - extendedWaitUntil:
                notVisible:
                  id: 'UIKeyboardLayoutStar.*'
                timeout: 10000
