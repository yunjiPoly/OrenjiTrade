# Trading safety (stage R1 of the phone redesign, ADR 0018: deals ship by mail, payment stays
# outside the app): Ben (a fresh fictional collector driven from the host, scripts/messaging.js)
# writes to Ada, who uses the app. Her chat opens with the small safety tip at its start, in the
# wording of a chat without a card (the chat has no pinned card; the buying and selling tips are
# native flows 3 and 4, deal-deck-core-chat.yaml and deal-mark-sold.yaml): tapping it opens
# the "Trading safely" page in-app, the composer keeps working with the tip on screen, and the tip
# is still there after a relaunch (it is not dismissed; it replaced the meetup notice).
appId: ${APP_ID}
name: Safety tip at the start of a chat
tags:
  - launch-readiness
  - messages
  - redesign-r1
---
- runScript:
    file: scripts/messaging.js
    env:
      ACTION: setup
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.ada.email}
      PASSWORD: ${output.ada.password}
- extendedWaitUntil:
    visible:
      id: 'tab-messages'
    timeout: 60000
- tapOn:
    id: 'tab-messages'
- extendedWaitUntil:
    visible:
      id: 'conversation-row-${output.ben.handle}'
    timeout: 60000
- tapOn:
    id: 'conversation-row-${output.ben.handle}'
- extendedWaitUntil:
    visible:
      id: 'conversation-profile'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'chat-safety-tip'
    timeout: 30000
- assertVisible:
    id: 'chat-safety-tip'
    text: '.*Agree on the price and shipping here\. Check ratings before you send an e-Transfer\.'
- assertNotVisible: '.*[Mm]eet in a busy public place.*'
- assertVisible: 'Hi Ada, still trading the Emberfang Fox\?'
- takeScreenshot: chat-safety-tip

# The guide, in-app, then back to the chat with the tip still there.
- tapOn:
    id: 'chat-safety-tip'
- extendedWaitUntil:
    visible:
      id: 'screen-legal-document'
    timeout: 60000
- assertVisible: 'Trading safely'
- assertVisible:
    id: 'legal-draft-banner'
- runFlow: subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: 'chat-safety-tip'
    timeout: 30000

# The composer is never blocked by the tip.
- tapOn:
    id: 'conversation-input'
- inputText: 'How much with shipping?'
- runFlow: subflows/hide-keyboard.yaml
- tapOn:
    id: 'conversation-send'
- extendedWaitUntil:
    visible: 'How much with shipping\?'
    timeout: 60000
- runScript:
    file: scripts/messaging.js
    env:
      ACTION: expect
      EMAIL: ${output.ben.email}
      PASSWORD: ${output.ben.password}
      CONVERSATION: ${output.conversation.id}
      EXPECT_BODY: 'How much with shipping?'
      EXPECT_READ: 'false'
- assertVisible:
    id: 'chat-safety-tip'

# Not dismissed: still at the start of the chat after a relaunch.
- runFlow: subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: 'tab-messages'
    timeout: 60000
- tapOn:
    id: 'tab-messages'
- extendedWaitUntil:
    visible:
      id: 'conversation-row-${output.ben.handle}'
    timeout: 60000
- tapOn:
    id: 'conversation-row-${output.ben.handle}'
- extendedWaitUntil:
    visible:
      id: 'conversation-profile'
    timeout: 60000
- assertVisible: 'How much with shipping\?'
- assertVisible:
    id: 'chat-safety-tip'
- takeScreenshot: chat-safety-tip-relaunch
