# The card search and the card page (mobile Phase 2; Search and Who has this card since stage
# R5): a fresh collector types a card of the mock catalog of the isolated database, narrows the
# results with a game chip, opens a card and picks its French printing in "Any printing ▾".
appId: ${APP_ID}
name: Type a card on Search and open its page
tags:
  - mobile-m2
  - catalog
---
- runScript:
    file: scripts/create-collector.js
    env:
      PREFIX: search
      DISPLAY_NAME: Maestro Searcher
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
- extendedWaitUntil:
    visible:
      id: 'screen-search'
    timeout: 60000

# The field of Search opens the card search with the keyboard up (stage R5, screen 12): the
# privacy line of the recent searches, then live, typo-tolerant results.
- tapOn:
    id: 'search-field'
- extendedWaitUntil:
    visible:
      id: 'search-input'
    timeout: 30000
- assertVisible:
    id: 'recent-searches-privacy'
- inputText: 'emberfang'
- runFlow: subflows/hide-keyboard.yaml
- extendedWaitUntil:
    visible: 'Emberfang Fox VMAX, Pokémon'
    timeout: 30000
- assertVisible: 'Emberfang Fox, Pokémon'

# The game chips are the only filter: Yu-Gi-Oh! has no Emberfang, All games brings it back.
- tapOn:
    id: 'search-game-yugioh'
- extendedWaitUntil:
    visible:
      id: 'search-no-match'
    timeout: 30000
- tapOn:
    id: 'search-game-__all__'
- extendedWaitUntil:
    visible: 'Emberfang Fox VMAX, Pokémon'
    timeout: 30000
- takeScreenshot: search-results

# The card page, Who has this card: the game, the name, "Check TCGplayer price" and "Any
# printing"; the sheet of printings filters the holders to the French one.
- tapOn: 'Emberfang Fox VMAX, Pokémon'
- extendedWaitUntil:
    visible:
      id: 'card-name'
      text: 'Emberfang Fox VMAX'
    timeout: 60000
- assertVisible:
    id: 'card-game'
    text: 'POKÉMON'
- assertVisible:
    id: 'card-tcgplayer'
- takeScreenshot: card-detail
- tapOn:
    id: 'card-printing'
- extendedWaitUntil:
    visible:
      id: 'card-printing-sheet'
    timeout: 30000
- tapOn: 'SVX-001 · .*French.*'
- extendedWaitUntil:
    visible:
      id: 'card-printing'
      text: 'SVX-001 · .*French.*'
    timeout: 30000
- takeScreenshot: card-printing-fr
