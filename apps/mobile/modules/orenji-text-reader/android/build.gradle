plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.orenjitextreader'
version = '0.1.0'

android {
  namespace "expo.modules.orenjitextreader"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ML Kit text recognition, Latin script, with the model BUNDLED in the app (offline from the
  // first scan; no Google Play services download). Pinned.
  implementation "com.google.mlkit:text-recognition:16.0.1"
}
