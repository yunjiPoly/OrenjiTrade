# The region map (ADR 0017, mobile stage M9): a seed collector (collector1, Quebec) opens the app
# on the Map tab, which draws Americas (North) from the borders the app ships (no tile server, no
# GPS) and counts its public binders; the list of states and provinces opens a state without a
# binder (Alaska) and then Quebec, whose public binders name their owner and "Quebec, Canada",
# never a city or a distance; one binder opens. Then Sofia's profile (seed collector5,
# California, showing her city) shows her state and city, never a distance or a zone.
# The seed account is only signed in to; what Quebec holds is read on the host from the public
# API (scripts/region-map.js).
appId: ${APP_ID}
name: Region map, a state through the list, its binders and a binder
tags:
  - mobile-m9
  - map
---
- runScript:
    file: scripts/region-map.js
    env:
      REGION: americas-north
      CODE: CA-QC
      BINDER: 'Pokémon holo binder'
# The seed predates the 18+ rule: its confirmation is recorded through the API first (the
# onboarding age step is proven by age-step-existing-account.yaml).
- runScript:
    file: scripts/confirm-age.js
    env:
      EMAIL: ${SEED_EMAIL}
      PASSWORD: ${SEED_PASSWORD}
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${SEED_EMAIL}
      PASSWORD: ${SEED_PASSWORD}
- extendedWaitUntil:
    visible:
      id: 'screen-map'
    timeout: 60000

# The Map tab: the home region, its count, the map as one named image, the zoom buttons.
- extendedWaitUntil:
    visible:
      id: 'map-title'
      text: 'Binders in Americas \(North\)'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'map-status'
      text: '[0-9]+ public binders in Americas \(North\)'
    timeout: 30000
- assertVisible:
    id: 'map-region'
    text: 'Region: Americas \(North\)'
- assertVisible:
    id: 'region-map'
    text: 'Map of Americas \(North\): states and provinces shaded by their number of public binders'
- assertVisible:
    id: 'region-map-zoom-in'
- assertNotVisible:
    id: 'map-choose-location'
# At home: nothing says "not your region".
- assertNotVisible:
    id: 'map-region-home'
- assertNotVisible: 'The region map is coming to the app'
- takeScreenshot: region-map

# Closer, then the whole region again (a pinch does the same on a phone).
- tapOn:
    id: 'region-map-zoom-in'
- extendedWaitUntil:
    visible:
      id: 'region-map-reset'
    timeout: 10000
- tapOn:
    id: 'region-map-reset'
- extendedWaitUntil:
    notVisible:
      id: 'region-map-reset'
    timeout: 10000

# The list of states and provinces: the other way in, with a name and a count per place.
- tapOn:
    id: 'map-view-list'
- extendedWaitUntil:
    visible:
      id: 'place-list-filter'
    timeout: 30000
- assertNotVisible:
    id: 'region-map'

# A state without a public binder says so.
- tapOn:
    id: 'place-list-filter'
- inputText: 'Alaska'
- runFlow: subflows/hide-keyboard.yaml
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'place-row-US-AK'
- assertVisible:
    id: 'place-row-US-AK'
    text: 'Alaska, No public binders'
- tapOn:
    id: 'place-row-US-AK'
- extendedWaitUntil:
    visible:
      id: 'place-title'
      text: 'Alaska, United States'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'place-empty'
    timeout: 30000
- assertVisible: 'No public binders here yet'
- takeScreenshot: place-empty
- runFlow: subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: 'place-list-filter'
    timeout: 30000

# Quebec, through "Only places with binders".
- tapOn:
    id: 'place-list-filter'
- eraseText: 10
- runFlow: subflows/hide-keyboard.yaml
- runFlow:
    file: subflows/scroll-up-to.yaml
    env:
      ID: 'place-list-only-with-binders'
- tapOn:
    id: 'place-list-only-with-binders'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'place-row-CA-QC'
- assertVisible:
    id: 'place-row-CA-QC'
    text: 'Quebec, [0-9]+ public binders'
- assertNotVisible:
    id: 'place-row-US-AK'
- takeScreenshot: place-list
- tapOn:
    id: 'place-row-CA-QC'

# Its public binders: the binder, its owner by name and handle, "Quebec, Canada", its cards and
# its last update. Maïka shows her city on her own profile only.
- extendedWaitUntil:
    visible:
      id: 'place-title'
      text: 'Quebec, Canada'
    timeout: 30000
- assertVisible:
    id: 'place-count'
    text: '[0-9]+ public binders'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'place-binder-${output.binder.id}'
- assertVisible:
    id: 'place-binder-${output.binder.id}'
    text: '${output.binder.name}, .* cards?, by ${output.binder.owner}, @${output.binder.handle}, Quebec, Canada, Updated .*'
- assertNotVisible: '.*Montréal.*'
- assertNotVisible: '.*km away.*'
- takeScreenshot: place-binders

# The binder opens; back names the state, then the map.
- tapOn:
    id: 'place-binder-${output.binder.id}'
- extendedWaitUntil:
    visible:
      id: 'public-binder-title'
      text: ${output.binder.name}
    timeout: 60000
- runFlow: subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: 'place-binder-${output.binder.id}'
    timeout: 30000
- runFlow: subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: 'place-row-CA-QC'
    timeout: 30000

# Sofia's profile (deep link): her state and the city she shows, never a distance or a zone.
- openLink: ${APP_URL}/--/collectors/collector5
- runFlow: subflows/dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: 'collector-name'
      text: 'Sofia Nguyen'
    timeout: 60000
- assertVisible:
    id: 'collector-location'
    text: 'Los Angeles, California, United States'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'collector-area-note'
- assertVisible:
    id: 'collector-area-note'
    text: 'On the map in California, United States.*'
- assertNotVisible: '.*km away.*'
- takeScreenshot: collector-profile-place
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'collector-binders'
- assertVisible:
    id: 'collector-ratings'
