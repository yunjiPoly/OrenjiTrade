<header class="top-bar">
  <mat-toolbar class="top-bar__toolbar">
    <app-wordmark class="top-bar__wordmark" />

    <nav class="top-bar__nav" aria-label="Primary">
      @for (link of navLinks(); track link.path) {
        <a
          matButton
          class="top-bar__link"
          [routerLink]="link.path"
          routerLinkActive="top-bar__link--active"
          ariaCurrentWhenActive="page"
        >
          <mat-icon aria-hidden="true">{{ link.icon }}</mat-icon>
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- The autocomplete (Material autocomplete + overlay) is a lazy chunk; the plain search
         field stands in until the browser is idle and keeps Enter-to-search working. -->
    @defer (on idle) {
      <app-card-search-box class="top-bar__search" />
    } @placeholder {
      <app-search-field
        class="top-bar__search"
        label="Search cards"
        placeholder="Search cards or printing codes"
        (querySubmit)="querySubmit.emit($event)"
      />
    }

    <div class="top-bar__actions">
      <button
        matIconButton
        type="button"
        aria-label="Notifications"
        matTooltip="Notifications"
        [matBadge]="unreadNotifications()"
        [matBadgeHidden]="unreadNotifications() === 0"
        matBadgeSize="small"
        matBadgeColor="primary"
      >
        <mat-icon>notifications</mat-icon>
      </button>

      <app-theme-toggle />

      <app-account-menu />
    </div>
  </mat-toolbar>
</header>
