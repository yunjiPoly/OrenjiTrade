# Session restore and sign out (Phase 1): a signed-in collector stays signed in after the app is
# killed and relaunched (Firebase Auth React Native persistence on AsyncStorage), signs out from
# Settings (the Profile tab's gear), lands on Home as a guest (stage R15) and stays signed out
# after another relaunch.
appId: ${APP_ID}
name: Session restore and sign out
tags:
  - mobile-m1
  - auth
---
- runScript:
    file: scripts/create-collector.js
    env:
      PREFIX: out
      DISPLAY_NAME: Maestro Leaver
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
- runFlow: subflows/open-profile-tab.yaml

# Session restore on launch.
- runFlow: subflows/relaunch.yaml
- runFlow: subflows/open-profile-tab.yaml
- assertVisible:
    id: 'profile-name'
    text: 'Maestro Leaver'

# Sign out, in Settings behind the Profile tab's gear (stage R6). (The scroll subflow brings the
# row into the upper part of the screen before the tap.)
- tapOn:
    id: 'profile-settings'
- extendedWaitUntil:
    visible:
      id: 'screen-settings'
    timeout: 30000
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'settings-sign-out'
- tapOn:
    id: 'settings-sign-out'
# Stage R15: signing out lands on Home as a guest (the person button for the bell, the guest's
# card), never on the collector's last screen.
- extendedWaitUntil:
    visible:
      id: 'screen-home'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'person-button-home'
    timeout: 30000
- assertVisible:
    id: 'home-guest-card'
- assertNotVisible:
    id: 'screen-settings'

# Still signed out after a relaunch: Home as a guest again.
- runFlow: subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: 'person-button-home'
    timeout: 60000
- takeScreenshot: signed-out
