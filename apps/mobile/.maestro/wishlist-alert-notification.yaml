# Wishlist + wishlist alerts (stage S2 of the 2026-10-08 product change, ADR 0017): Wren (fresh,
# fictional, discoverable, in Montevideo: Americas (South), a region no other flow uses) adds
# Emberfang Fox to her wishlist through the app with a public note, "Near Mint only" and a price
# term (no price, trade preference, private note or alert switch any more); Hal, in the same
# region, lists a Near Mint copy publicly (host script scripts/wishlist.js). Wren gets one wishlist
# alert over the realtime channel: the bell's orange dot shows without a reload (stage R9); the
# alert, under New in Notifications, names Hal's state (never a city, a distance or a position)
# and opens Who has this card.
appId: ${APP_ID}
name: Wishlist alert, notification and card page
tags:
  - mobile-m4
  - wishlist
  - notifications
---
- runScript:
    file: scripts/wishlist.js
    env:
      ACTION: setup
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.wren.email}
      PASSWORD: ${output.wren.password}
- runFlow: subflows/open-search-tab.yaml
# Search › Wishlist (the old Wishlist tab, stage R5): the alert switch, "Add a wish".
- tapOn:
    id: 'search-segment-wishlist'
- extendedWaitUntil:
    visible:
      id: 'wishlist-empty'
    timeout: 60000
- assertVisible:
    id: 'wishlist-alerts-switch'
- assertNotVisible:
    id: 'wishlist-location-prompt'
- tapOn:
    id: 'wishlist-add'

# The wish: card autocomplete, then the public note, Near Mint only and a price term.
- extendedWaitUntil:
    visible:
      id: 'card-picker-input'
    timeout: 60000
- tapOn:
    id: 'card-picker-input'
- inputText: 'emberfang'
- runFlow: subflows/hide-keyboard.yaml
- extendedWaitUntil:
    visible:
      id: 'suggestion-CARD-PFT-002'
    timeout: 60000
- tapOn:
    id: 'suggestion-CARD-PFT-002'
- extendedWaitUntil:
    visible:
      id: 'wish-card'
    timeout: 60000
- assertNotVisible:
    id: 'wish-radius'
- assertNotVisible:
    id: 'wish-max-price'
- tapOn:
    id: 'wish-note'
- inputText: 'Fictional Maestro wish.'
- runFlow: subflows/hide-keyboard.yaml
- tapOn:
    id: 'wish-near-mint'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'wish-term-85'
- tapOn:
    id: 'wish-term-85'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'wish-save'
- tapOn:
    id: 'wish-save'
- extendedWaitUntil:
    visible:
      id: 'search-wishlist'
    timeout: 60000
- extendedWaitUntil:
    visible: '.*NM only · 85% TCG.*'
    timeout: 30000
- assertNotVisible: '.*[Mm]atch.*'
- runScript:
    file: scripts/wishlist.js
    env:
      ACTION: expect-wish
      EMAIL: ${output.wren.email}
      PASSWORD: ${output.wren.password}
- takeScreenshot: wishlist-wish

# Hal lists a Near Mint copy in the region: one alert, live.
- runScript:
    file: scripts/wishlist.js
    env:
      ACTION: list
      EMAIL: ${output.hal.email}
      PASSWORD: ${output.hal.password}
      BINDER: ${output.hal.binderId}
- extendedWaitUntil:
    visible:
      id: 'notification-bell-search-dot'
    timeout: 90000
- assertVisible:
    id: 'notification-bell-search'
    text: 'Notifications, 1 new'
- takeScreenshot: wishlist-alert-live

# Notifications (stage R9): the alert under New, "{card} from your wishlist was listed in
# {province}" over "{lister} · {price}", then Who has this card.
- tapOn:
    id: 'notification-bell-search'
- extendedWaitUntil:
    visible:
      id: 'screen-notifications'
    timeout: 60000
- extendedWaitUntil:
    visible: 'Emberfang Fox from your wishlist was listed in Montevideo\. .*'
    timeout: 60000
- assertVisible:
    id: 'notifications-section-fresh'
- assertNotVisible: '.*Uruguay.*'
- assertNotVisible: '.*km away.*'
- takeScreenshot: notifications-centre
# The alert by the start of its name: iOS names the whole row "Emberfang Fox from your wishlist
# was listed in Montevideo. hal… · …, 1 minute ago, unread".
- tapOn: 'Emberfang Fox from your wishlist was listed in Montevideo\. .*'
- extendedWaitUntil:
    visible:
      id: 'card-name'
      text: 'Emberfang Fox'
    timeout: 60000
# The wish is for any printing: the alert says so (?printing=any) and Who has this card starts
# on "Any printing", never a printing picked for the collector; Hal's copy is under Montevideo.
- assertVisible:
    id: 'card-printing'
    text: 'Any printing.*'
- runFlow:
    file: subflows/list-scroll-to.yaml
    env:
      ID: 'holders-group-UY-MO'
- assertVisible:
    id: 'holders-group-UY-MO'
- takeScreenshot: wishlist-alert-card
