# Wishlist + notifications (mobile Phase 6, ADR 0017): Wren (fresh, fictional, discoverable, in
# Montevideo: Americas (South), a region no other flow uses) adds Emberfang Fox to her wishlist
# through the app; Hal, in the same region, lists it publicly (host script scripts/wishlist.js).
# The matcher pairs the region: it notifies Wren over the realtime channel, the bell's badge and
# the wish's match count rise without a reload; the notification opens the wish's matches (Hal's
# state, never a distance or a position), and Message opens a conversation with Hal.
appId: host.exp.exponent
name: Wishlist match, notification and deep link
tags:
  - mobile-m4
  - wishlist
  - notifications
---
- runScript:
    file: scripts/wishlist.js
    env:
      ACTION: setup
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.wren.email}
      PASSWORD: ${output.wren.password}
- extendedWaitUntil:
    visible:
      id: 'tab-wishlist'
    timeout: 60000
- tapOn:
    id: 'tab-wishlist'
- extendedWaitUntil:
    visible:
      id: 'wishlist-empty'
    timeout: 60000
- tapOn:
    id: 'wishlist-empty-action'

# The wish: card autocomplete, then save (no radius: the wish matches the region).
- extendedWaitUntil:
    visible:
      id: 'card-picker-input'
    timeout: 60000
- tapOn:
    id: 'card-picker-input'
- inputText: 'emberfang'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'suggestion-CARD-PFT-002'
    timeout: 60000
- tapOn:
    id: 'suggestion-CARD-PFT-002'
- extendedWaitUntil:
    visible:
      id: 'wish-card'
    timeout: 60000
- assertNotVisible:
    id: 'wish-radius'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'wish-save'
- tapOn:
    id: 'wish-save'
- extendedWaitUntil:
    visible:
      id: 'wishlist-summary'
    timeout: 60000
- assertVisible: '.*No matches yet.*'
- runScript:
    file: scripts/wishlist.js
    env:
      ACTION: expect-wish
      EMAIL: ${output.wren.email}
      PASSWORD: ${output.wren.password}
- takeScreenshot: wishlist-wish

# Hal lists the card in the region: the bell and the match count follow live.
- runScript:
    file: scripts/wishlist.js
    env:
      ACTION: list
      EMAIL: ${output.hal.email}
      PASSWORD: ${output.hal.password}
      BINDER: ${output.hal.binderId}
- extendedWaitUntil:
    visible:
      id: 'notification-bell-wishlist-badge'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*1 match.*'
    timeout: 60000
- takeScreenshot: wishlist-match-live

# The notification centre, then the deep link to the matches.
- tapOn:
    id: 'notification-bell-wishlist'
- extendedWaitUntil:
    visible:
      id: 'screen-notifications'
    timeout: 60000
- extendedWaitUntil:
    visible: '.*Wishlist match: Emberfang Fox.*'
    timeout: 60000
- takeScreenshot: notifications-centre
# The title itself (a pattern would also match the row's "Mark as read: …" button).
- tapOn: 'Wishlist match: Emberfang Fox'
- extendedWaitUntil:
    visible:
      id: 'wish-matches-head'
    timeout: 60000
- assertVisible: 'Hal Maestro'
# Hal's state, never a distance.
- assertVisible:
    id: 'match-place'
    text: 'Montevideo, Uruguay'
- assertNotVisible: '.*km away.*'
- takeScreenshot: wishlist-matches

# Message Hal from the match.
- tapOn: 'Message'
- extendedWaitUntil:
    visible:
      id: 'conversation-profile'
    timeout: 60000
- assertVisible: '.*Hal Maestro.*'
