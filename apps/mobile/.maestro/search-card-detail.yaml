# The card search and the card page (mobile Phase 2; Search and Who has this card since stage
# R5): a fresh collector types a card of the mock catalog of the isolated database, narrows the
# results with a game chip, opens a card and picks its French printing in "Any printing ▾".
appId: ${APP_ID}
name: Type a card on Search and open its page
tags:
  - mobile-m2
  - catalog
---
- runScript:
    file: scripts/create-collector.js
    env:
      PREFIX: search
      DISPLAY_NAME: Maestro Searcher
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
- extendedWaitUntil:
    visible:
      id: 'screen-search'
    timeout: 60000

# The field of Search opens the card search with the keyboard up (stage R5, screen 12): the
# privacy line of the recent searches, then live, typo-tolerant results.
- tapOn:
    id: 'search-field'
- extendedWaitUntil:
    visible:
      id: 'search-input'
    timeout: 30000
- assertVisible:
    id: 'recent-searches-privacy'
- inputText: 'emberfang'
- runFlow: subflows/hide-keyboard.yaml
- extendedWaitUntil:
    visible: 'Emberfang Fox VMAX'
    timeout: 30000
- assertVisible: 'Emberfang Fox'

# One game at a time (stage G): the field names the browsed game (the collector's Pokémon), and
# the game pill chooses it. On Yu-Gi-Oh! the same text finds only Yu-Gi-Oh! cards (the seed's
# Ember Wyrmling, a near match), no Emberfang; Pokémon brings it back. (Yu-Gi-Oh!'s empty state is
# native flow G's.)
- assertVisible:
    id: 'search-game'
    text: 'Game: Pokémon\. Change game'
- tapOn:
    id: 'search-game'
- extendedWaitUntil:
    visible:
      id: 'search-game-sheet-option-yugioh'
    timeout: 15000
- tapOn:
    id: 'search-game-sheet-option-yugioh'
- extendedWaitUntil:
    visible: 'Ember Wyrmling'
    timeout: 30000
- assertNotVisible: 'Emberfang Fox VMAX'
- tapOn:
    id: 'search-game'
- extendedWaitUntil:
    visible:
      id: 'search-game-sheet-option-pokemon'
    timeout: 15000
- tapOn:
    id: 'search-game-sheet-option-pokemon'
- extendedWaitUntil:
    visible: 'Emberfang Fox VMAX'
    timeout: 30000
- takeScreenshot: search-results

# The card page, Who has this card: the game, the name, "Check TCGplayer price" and "Any
# printing"; the sheet of printings filters the holders to the French one.
- tapOn: 'Emberfang Fox VMAX'
- extendedWaitUntil:
    visible:
      id: 'card-name'
      text: 'Emberfang Fox VMAX'
    timeout: 60000
- assertVisible:
    id: 'card-game'
    text: 'POKÉMON'
- assertVisible:
    id: 'card-tcgplayer'
- takeScreenshot: card-detail
- tapOn:
    id: 'card-printing'
- extendedWaitUntil:
    visible:
      id: 'card-printing-sheet'
    timeout: 30000
- tapOn: 'SVX-001 · .*French.*'
- extendedWaitUntil:
    visible:
      id: 'card-printing'
      text: 'SVX-001 · .*French.*'
    timeout: 30000
- takeScreenshot: card-printing-fr
