# Waits until OrenjiTrade rendered one of its screens (after the boot screen restored the session).
# On iOS, Expo Go's floating developer-tools button is then switched off (hide-tools-button.yaml).
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: 'screen-.*'
    timeout: 240000
- runFlow:
    when:
      visible:
        id: 'boot-screen'
    commands:
      - extendedWaitUntil:
          notVisible:
            id: 'boot-screen'
          timeout: 60000
- runFlow:
    when:
      platform: iOS
    file: hide-tools-button.yaml
