# Waits until OrenjiTrade rendered one of its screens (after the boot screen restored the session).
appId: host.exp.exponent
---
- extendedWaitUntil:
    visible:
      id: 'screen-.*'
    timeout: 240000
- runFlow:
    when:
      visible:
        id: 'boot-screen'
    commands:
      - extendedWaitUntil:
          notVisible:
            id: 'boot-screen'
          timeout: 60000
# Expo Go 58's floating tools button sits on the header buttons: turn it off (see the subflow).
- runFlow: hide-tools-button.yaml
