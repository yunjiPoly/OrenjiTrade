# Collector reports (mobile Phase 7): Ada (fresh, fictional) opens the profile of Bo (fresh,
# fictional; scripts/offers.js) and reports him: the reasons of the API, details, Confirm, the
# confirmation; My reports shows the open report and the API holds it (status only).
appId: host.exp.exponent
name: Report a collector and follow it in My reports
tags:
  - mobile-m5
  - reports
---
- runScript:
    file: scripts/offers.js
    env:
      ACTION: reporting
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.ada.email}
      PASSWORD: ${output.ada.password}
- extendedWaitUntil:
    visible:
      id: 'tab-index'
    timeout: 60000

# Bo's profile (deep link, like a shared https://www.orenjitrade.com/collectors/<handle>).
- openLink: ${APP_URL}/--/collectors/${output.bo.handle}
- runFlow: subflows/dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: 'collector-name'
      text: 'Bo Reported'
    timeout: 60000
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'collector-report'
- tapOn:
    id: 'collector-report'

# The report: a reason of the API's list, details, Confirm.
- extendedWaitUntil:
    visible:
      id: 'report-reason-HARASSMENT'
    timeout: 60000
- assertVisible:
    id: 'report-target'
    text: 'Bo Reported'
- tapOn:
    id: 'report-reason-HARASSMENT'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'report-details'
- tapOn:
    id: 'report-details'
- inputText: 'Insults after a declined trade.'
- hideKeyboard
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'report-confirm'
- takeScreenshot: report-form
- tapOn:
    id: 'report-confirm'
- extendedWaitUntil:
    visible:
      id: 'report-sent'
    timeout: 60000
- takeScreenshot: report-sent
- runScript:
    file: scripts/offers.js
    env:
      ACTION: expect-report
      EMAIL: ${output.ada.email}
      PASSWORD: ${output.ada.password}
      HANDLE: ${output.bo.handle}
      REASON: HARASSMENT

# My reports: the open report, its reason and where the review stands.
- tapOn:
    id: 'report-my-reports'
- extendedWaitUntil:
    visible:
      id: 'reports-summary'
      text: '1 waiting for a decision · 0 reviewed'
    timeout: 60000
- assertVisible: 'Bo Reported'
- assertVisible: 'Waiting for a moderator'
- takeScreenshot: my-reports
