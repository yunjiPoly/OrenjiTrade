# Signs in through the sign-in screen (empty fields: right after launch-fresh) with EMAIL /
# PASSWORD and waits until the app left it.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: 'screen-sign-in'
    timeout: 60000
- tapOn:
    id: 'sign-in-email'
- inputText: ${EMAIL}
- tapOn:
    id: 'sign-in-password'
- inputText: ${PASSWORD}
- runFlow: hide-keyboard.yaml
- tapOn:
    id: 'sign-in-submit'
- extendedWaitUntil:
    notVisible:
      id: 'screen-sign-in'
    timeout: 60000
