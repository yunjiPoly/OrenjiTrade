# Card holders with filters (mobile stage M7, ADR 0017): Ada (fresh, fictional, in Quebec) opens
# Emberfang Fox, which Ben (in Wyoming, the same platform region; scripts/parity.js) lists twice in
# a public binder, presses "Who has this in my region" and gets the holders as a list: both copies
# with their prices and Ben's state (never a distance), sorted by price, then narrowed to the
# Lightly Played copy, then every copy again. The whole region is listed, so the flow follows
# Ben's two copies (never counts). (The availability filter "Sale" also matches "trade or sale"
# copies, so the condition narrows here.)
appId: host.exp.exponent
name: Card holders list with sort and filters
tags:
  - mobile-m7
  - search
---
- runScript:
    file: scripts/parity.js
    env:
      ACTION: holders
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.ada.email}
      PASSWORD: ${output.ada.password}
- extendedWaitUntil:
    visible:
      id: 'tab-index'
    timeout: 60000

# The card (deep link, like a shared https://www.orenjitrade.com/cards/<id>).
- openLink: ${APP_URL}/--/cards/${output.card.id}
- runFlow: subflows/dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: 'card-name'
      text: ${output.card.name}
    timeout: 60000
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'card-holders'
- tapOn:
    id: 'card-holders'

# The list: both copies, Ben's state only.
- extendedWaitUntil:
    visible:
      id: 'holders-title'
      text: 'Who has ${output.card.name} in your region'
    timeout: 60000
- runFlow:
    file: subflows/list-scroll-to.yaml
    env:
      ID: 'holder-${output.items.offers}'
- assertVisible:
    id: 'holder-${output.items.offers}-price'
    text: '.*45.*'
# The holder line sits at the bottom of the card: bring it on screen before reading it.
- runFlow:
    file: subflows/list-scroll-to.yaml
    env:
      ID: 'holder-${output.items.offers}-collector'
- assertVisible:
    id: 'holder-${output.items.offers}-collector'
    text: '.*Wyoming, United States.*'
- assertNotVisible: '.*km away.*'
- takeScreenshot: holders-list

# Sorted by price: the 20 CAD copy comes first.
- tapOn:
    id: 'holders-sort'
- extendedWaitUntil:
    visible:
      id: 'holders-sort-option-price'
    timeout: 30000
- tapOn:
    id: 'holders-sort-option-price'
# The cheaper copy may now sit above or below the scrolled part of the list.
- runFlow:
    file: subflows/list-scroll-to.yaml
    env:
      ID: 'holder-${output.items.cheap}'

# Narrowed to the Lightly Played copy: the 20 CAD copy stays.
- tapOn:
    id: 'holders-filters'
- extendedWaitUntil:
    visible:
      id: 'holder-condition-LIGHTLY_PLAYED'
    timeout: 30000
- tapOn:
    id: 'holder-condition-LIGHTLY_PLAYED'
- tapOn:
    id: 'holder-filters-done'
# The cheaper copy may now sit above or below the scrolled part of the list.
- runFlow:
    file: subflows/list-scroll-to.yaml
    env:
      ID: 'holder-${output.items.cheap}'
- assertNotVisible:
    id: 'holder-${output.items.offers}'
- takeScreenshot: holders-filtered

# Cleared: every copy again.
- tapOn:
    id: 'holders-filters'
- extendedWaitUntil:
    visible:
      id: 'holder-filters-clear'
    timeout: 30000
- tapOn:
    id: 'holder-filters-clear'
- tapOn:
    id: 'holder-filters-done'
- runFlow:
    file: subflows/list-scroll-to.yaml
    env:
      ID: 'holder-${output.items.offers}'
- assertNotVisible:
    id: 'holders-map'
- takeScreenshot: holders-cleared
