# nginx configuration template for the OrenjiTrade web container.
# Rendered by docker-entrypoint.sh with envsubst for: ${PORT} ${API_BASE_URL} ${WS_BASE_URL} ${FIREBASE_AUTH_DOMAIN}
# (only those variables are substituted; nginx's own $variables are left intact).

# Content-Security-Policy. Allows: self, Google Fonts, Firebase Auth / Identity Platform (Google
# sign-in, Google account avatars), the API over http(s)/ws(s) (also for avatars served by the
# API's local storage) and, only when FIREBASE_AUTH_EMULATOR_HOST is set (local containers), the
# Firebase Auth emulator. No map provider or tile server: the region map draws bundled boundary
# files (ADR 0017). Permissions-Policy denies geolocation: the app never asks for a position.
map $host $orenji_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: ${API_BASE_URL} https://*.googleusercontent.com; connect-src 'self' ${API_BASE_URL} ${WS_BASE_URL} ${AUTH_EMULATOR_ORIGIN} https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://${FIREBASE_AUTH_DOMAIN}; frame-src https://${FIREBASE_AUTH_DOMAIN} https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests";
}

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run / load balancer sit in front; trust their X-Forwarded-* headers for logging only.
    absolute_redirect off;
    server_tokens off;

    # ---- compression ----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        application/manifest+json image/svg+xml font/woff2 application/wasm;

    # ---- security headers (added to every response, including errors) ----------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy $orenji_csp always;

    # ---- health check for Cloud Run / Docker --------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- never cache the entry point and runtime configuration -------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy $orenji_csp always;
        try_files $uri =404;
    }

    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /config.template.json {
        return 404;
    }

    # ---- hashed build artefacts: immutable for a year -----------------------------------------
    # Angular's outputHashing emits `<name>-<8 char hash>.<ext>` (e.g. main-7BFSCCSQ.js, chunk-CtZ2Z1cS.js).
    location ~* "[-.][0-9a-zA-Z_-]{8}\.(js|mjs|css|woff2?|ttf|otf|svg|png|jpe?g|webp|avif|gif|ico|map)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- other static assets (favicon, images from public/): short cache ----------------------
    location ~* "\.(js|mjs|css|woff2?|ttf|otf|svg|png|jpe?g|webp|avif|gif|ico|json|txt|xml|webmanifest)$" {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- SPA fallback: every other path is a client-side route ------------------------------
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy $orenji_csp always;
        try_files $uri $uri/ /index.html;
    }
}
