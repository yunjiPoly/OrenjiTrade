# Hides the on-screen keyboard the way each platform lets a collector do it.
# Android: its own "hide keyboard" (the back key).
# iOS has no such key. A collector drags the list under the field (Search and the card pickers
# let go of the keyboard when a drag begins) or taps beside the fields of a form. Both happen
# along the right edge of the screen, in the pages' padding and never on a control: a short drag
# first, then, only while a keyboard is still on screen, a tap.
# (Maestro's own hideKeyboard is not used on iOS: it flicks the middle of the screen, which
# presses whatever is there, for example the "Forgot your password?" link of the sign-in screen.
# In a form dialog use hide-keyboard-in-dialog.yaml: beside a dialog there is only its backdrop.)
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 98%, 38%
          end: 98%, 30%
          duration: 300
      - runFlow:
          when:
            visible:
              id: 'UIKeyboardLayoutStar.*'
          commands:
            - tapOn:
                point: 98%, 30%
            - extendedWaitUntil:
                notVisible:
                  id: 'UIKeyboardLayoutStar.*'
                timeout: 10000
