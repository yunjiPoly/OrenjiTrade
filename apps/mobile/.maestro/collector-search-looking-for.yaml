# Collector search and "Looking for" (mobile stage M7, ADR 0017; the card search's Collectors
# since stage R5): Wren (fresh, fictional, discoverable, in Quebec) types Hal's name in the card
# search of Search (Hal in Wyoming,
# the same platform region; name search allowed, wishlist shown on his profile; scripts/parity.js),
# opens his profile from the result (his state only, never a distance) and reads what he is
# looking for, with "I have it" (stage R6).
appId: ${APP_ID}
name: Collector search, profile and Looking for
tags:
  - mobile-m7
  - mobile-r5
  - mobile-r6
  - search
---
- runScript:
    file: scripts/parity.js
    env:
      ACTION: looking-for
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.wren.email}
      PASSWORD: ${output.wren.password}
- runFlow: subflows/open-search-tab.yaml

# The card search (stage R5): collectors whose name matches show under the cards, at most three,
# with their state only. Two letters first: the field keeps what is typed next.
- tapOn:
    id: 'search-field'
- extendedWaitUntil:
    visible:
      id: 'search-input'
    timeout: 30000
- inputText: ${output.hal.displayName.slice(0, 2)}
- inputText: ${output.hal.displayName.slice(2)}
- assertVisible:
    id: 'search-input'
    text: ${output.hal.displayName}
- runFlow: subflows/hide-keyboard.yaml
- extendedWaitUntil:
    visible:
      id: 'search-collector-${output.hal.handle}'
    timeout: 60000
- assertVisible:
    id: 'search-collectors'
- assertVisible:
    id: 'search-collector-${output.hal.handle}'
    text: '.*Wyoming.*'
- assertNotVisible: '.*km away.*'
- takeScreenshot: search-collectors

# His profile (stage R6), then "Looking for": the Emberfang Fox wish with its terms and "I have
# it" (no note on the row, no price limit, no radius).
- tapOn:
    id: 'search-collector-${output.hal.handle}'
- extendedWaitUntil:
    visible:
      id: 'collector-name'
      text: ${output.hal.displayName}
    timeout: 60000
- assertVisible:
    id: 'collector-line'
    text: 'Wyoming · Member since \d{4}.*'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'profile-have-${output.card.id}'
- assertVisible: 'Any printing · NM only · 85% TCG'
- assertNotVisible: '.*km away.*'
- takeScreenshot: collector-looking-for
