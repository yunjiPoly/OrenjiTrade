# Binders (mobile Phase 3, the screens of stage R3): a fresh collector with one card (added on the
# host through the API) creates a binder from Inventory › Binders with the card picked from the
# inventory ("Add cards" of New binder), then makes it public from Edit binder.
# scripts/check-inventory.js checks on the host that the API holds the card in that binder and the
# binder public.
appId: ${APP_ID}
name: Create a binder and add a card
tags:
  - mobile-m2
  - binders
---
- runScript:
    file: scripts/create-collector.js
    env:
      # Yu-Gi-Oh! (stage G): the game of its card, Lantern Fox Spirit, so New binder starts on it
      # and Search browses it.
      GAMES: 'yugioh'
      PREFIX: bind
      DISPLAY_NAME: Maestro Binders
- runScript:
    file: scripts/add-card.js
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
      QUERY: 'Lantern Fox Spirit'
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
- extendedWaitUntil:
    visible:
      id: 'tab-inventory'
    timeout: 60000
- tapOn:
    id: 'tab-inventory'
- extendedWaitUntil:
    visible: 'Lantern Fox Spirit, .*'
    timeout: 60000

# The Binders view (screen 17): none yet, create one (New binder, screen 18) with the card in it.
- tapOn:
    id: 'inventory-view-binders'
- extendedWaitUntil:
    visible:
      id: 'binders-empty'
    timeout: 30000
- tapOn:
    id: 'inventory-new-binder'
- extendedWaitUntil:
    visible:
      id: 'binder-name'
    timeout: 30000
- tapOn:
    id: 'binder-name'
- inputText: 'Maestro trades'
- runFlow: subflows/hide-keyboard.yaml
- assertVisible:
    id: 'binder-cards-title'
    text: 'Cards inside'

# Add the card from the inventory (it moves in with the save).
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'binder-add-cards'
- tapOn:
    id: 'binder-add-cards'
- extendedWaitUntil:
    visible: 'Lantern Fox Spirit, .*unfiled'
    timeout: 30000
- tapOn: 'Lantern Fox Spirit, .*unfiled'
- tapOn:
    id: 'card-picker-submit'
- extendedWaitUntil:
    visible: 'Added when you save'
    timeout: 30000
- tapOn:
    id: 'edit-binder-save'
- extendedWaitUntil:
    visible: 'Saved.*, Maestro trades'
    timeout: 60000
- extendedWaitUntil:
    visible: 'Maestro trades, 1 card · Private'
    timeout: 60000

# Edit binder: make it public and save.
- tapOn: 'Maestro trades, 1 card · Private'
- extendedWaitUntil:
    visible:
      id: 'edit-binder-save'
      text: 'No changes yet'
    timeout: 60000
- tapOn:
    id: 'binder-visibility-PUBLIC'
- tapOn:
    id: 'edit-binder-save'
- extendedWaitUntil:
    visible: 'Maestro trades, 1 card · Public'
    timeout: 60000
- takeScreenshot: binder-published
- runScript:
    file: scripts/check-inventory.js
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
      EXPECT_COUNT: '1'
      EXPECT_BINDER: 'Maestro trades'
      EXPECT_BINDER_VISIBILITY: 'PUBLIC'
