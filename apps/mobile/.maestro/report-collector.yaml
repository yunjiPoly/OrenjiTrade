# Collector reports (mobile Phase 7; restyled in stage R14, mockup v50 screen 60): Ada (fresh,
# fictional) opens the profile of Bo (fresh, fictional; scripts/reports.js) and reports him from
# its "⋯": the reasons of the API as radio rows, "Send report" grey with "Choose a reason first."
# until one is chosen, details, Report sent in place; "Follow it in My reports" shows the open
# report and the API holds it (status only).
appId: ${APP_ID}
name: Report a collector and follow it in My reports
tags:
  - mobile-m5
  - reports
---
- runScript:
    file: scripts/reports.js
    env:
      ACTION: reporting
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.ada.email}
      PASSWORD: ${output.ada.password}
- extendedWaitUntil:
    visible:
      id: 'tab-search'
    timeout: 60000

# Bo's profile (deep link, like a shared https://www.orenjitrade.com/collectors/<handle>).
- openLink: ${APP_URL}/--/collectors/${output.bo.handle}
- runFlow: subflows/dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: 'collector-name'
      text: 'Bo Reported'
    timeout: 60000
# Report is in the profile's "⋯" sheet (stage R6).
- tapOn:
    id: 'collector-menu'
- extendedWaitUntil:
    visible:
      id: 'collector-report'
    timeout: 15000
- tapOn:
    id: 'collector-report'

# The report: a reason of the API's list, details, "Send report".
- extendedWaitUntil:
    visible:
      id: 'report-reason-HARASSMENT'
    timeout: 60000
- assertVisible:
    id: 'report-target'
    text: 'Bo Reported'
- assertVisible:
    id: 'report-confirm'
    text: 'Send report'
    enabled: false
- assertVisible:
    id: 'report-choose-first'
    text: 'Choose a reason first\.'
- takeScreenshot: report-empty
- tapOn:
    id: 'report-reason-HARASSMENT'
- assertNotVisible:
    id: 'report-choose-first'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'report-details'
- tapOn:
    id: 'report-details'
- inputText: 'Insults after a declined trade.'
- runFlow: subflows/hide-keyboard.yaml
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'report-confirm'
- takeScreenshot: report-form
- tapOn:
    id: 'report-confirm'
- extendedWaitUntil:
    visible:
      id: 'report-sent'
    timeout: 60000
- assertVisible: 'Report sent'
- assertVisible: 'Thank you\. Our moderators will review your report about Bo Reported\. They are not told who reported them\.'
- assertVisible:
    id: 'report-my-reports'
    text: 'Follow it in My reports'
- takeScreenshot: report-sent
- runScript:
    file: scripts/reports.js
    env:
      ACTION: expect-report
      EMAIL: ${output.ada.email}
      PASSWORD: ${output.ada.password}
      HANDLE: ${output.bo.handle}
      REASON: HARASSMENT

# My reports: the open report, its reason and where the review stands.
- tapOn:
    id: 'report-my-reports'
- extendedWaitUntil:
    visible:
      id: 'reports-summary'
      text: '1 waiting for a decision · 0 reviewed'
    timeout: 60000
# The row opens Bo's profile (stage R13: its name, then its status, reason and where the review
# stands as its value).
- assertVisible: 'Bo Reported\. Opens their profile\.'
- takeScreenshot: my-reports
