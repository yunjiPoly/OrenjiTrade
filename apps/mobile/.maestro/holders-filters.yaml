# Card holders with filters (mobile stage M7): Ada (fresh, fictional, a trading area around a
# random rural point) opens Emberfang Fox, which Ben (about 1.5 km away; scripts/parity.js) lists
# twice in a public binder, presses "Who has this near me" and gets the holders as a list: both
# copies with their prices, sorted by price, then narrowed to the Lightly Played copy, then every
# copy again; "Show on the map" is the alternative view. (The availability filter "Sale" also
# matches "trade or sale" copies, like the map's intent filter, so the condition narrows here.)
appId: host.exp.exponent
name: Card holders list with sort and filters
tags:
  - mobile-m7
  - search
---
- runScript:
    file: scripts/parity.js
    env:
      ACTION: holders
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.ada.email}
      PASSWORD: ${output.ada.password}
- extendedWaitUntil:
    visible:
      id: 'tab-index'
    timeout: 60000

# The card (deep link, like a shared https://www.orenjitrade.com/cards/<id>).
- openLink: ${APP_URL}/--/cards/${output.card.id}
- runFlow: subflows/dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: 'card-name'
      text: ${output.card.name}
    timeout: 60000
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'card-holders'
- tapOn:
    id: 'card-holders'

# The list: both copies, Ben's place and distance bucket only.
- extendedWaitUntil:
    visible:
      id: 'holders-count'
      text: '2 listings near you'
    timeout: 60000
- assertVisible:
    id: 'holders-title'
    text: 'Who has ${output.card.name} near you'
- extendedWaitUntil:
    visible:
      id: 'holder-${output.items.offers}'
    timeout: 60000
- assertVisible:
    id: 'holder-${output.items.offers}-price'
    text: '.*45.*'
- takeScreenshot: holders-list

# Sorted by price: the 20 CAD copy comes first.
- tapOn:
    id: 'holders-sort'
- extendedWaitUntil:
    visible:
      id: 'holders-sort-option-price'
    timeout: 30000
- tapOn:
    id: 'holders-sort-option-price'
- extendedWaitUntil:
    visible:
      id: 'holder-${output.items.cheap}'
    timeout: 60000
- assertVisible:
    id: 'holders-count'
    text: '2 listings near you'

# Narrowed to the Lightly Played copy: the 20 CAD copy stays.
- tapOn:
    id: 'holders-filters'
- extendedWaitUntil:
    visible:
      id: 'holder-condition-LIGHTLY_PLAYED'
    timeout: 30000
- tapOn:
    id: 'holder-condition-LIGHTLY_PLAYED'
- tapOn:
    id: 'holder-filters-done'
- extendedWaitUntil:
    visible:
      id: 'holders-count'
      text: '1 listing near you'
    timeout: 60000
- assertVisible:
    id: 'holder-${output.items.cheap}'
- assertNotVisible:
    id: 'holder-${output.items.offers}'
- takeScreenshot: holders-filtered

# Cleared: every copy again; the map stays the alternative view.
- tapOn:
    id: 'holders-filters'
- extendedWaitUntil:
    visible:
      id: 'holder-filters-clear'
    timeout: 30000
- tapOn:
    id: 'holder-filters-clear'
- tapOn:
    id: 'holder-filters-done'
- extendedWaitUntil:
    visible:
      id: 'holders-count'
      text: '2 listings near you'
    timeout: 60000
- tapOn:
    id: 'holders-map'
- extendedWaitUntil:
    visible:
      id: 'map-holders'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'map-status'
      text: '\d+ collectors? with this card within 10 km'
    timeout: 60000
- takeScreenshot: holders-map
