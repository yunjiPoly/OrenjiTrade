# The 18+ rule on an existing account (launch readiness; Review our terms since stage R12 of the
# phone redesign): a fictional collector created on the host WITHOUT the AGE_CONFIRMATION consent
# (every document accepted, profile complete: an account from before the rule) signs in and lands
# on Review our terms with the age line alone (no document due, no welcome step); "Accept and
# continue" waits while it is unticked and nothing is recorded; once confirmed, the tabs, "Welcome
# back" and the consent checked on the API (scripts/check-age.js).
appId: ${APP_ID}
name: Existing account confirms its age on Review our terms
tags:
  - launch-readiness
  - onboarding
  - r12
---
- runScript:
    file: scripts/create-collector.js
    env:
      PREFIX: age
      DISPLAY_NAME: Maestro Adult
      CONFIRM_AGE: 'false'
- runScript:
    file: scripts/check-age.js
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
      EXPECT: 'false'
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}

# Review our terms with the age line alone: no document, no welcome step.
- extendedWaitUntil:
    visible:
      id: 'screen-consent'
    timeout: 60000
- assertVisible: 'Please confirm your age to keep using OrenjiTrade\.'
- assertNotVisible:
    id: 'legal-consents'
- assertNotVisible:
    id: 'onboarding-profile'
- extendedWaitUntil:
    visible:
      id: 'age-confirmation'
    timeout: 30000
- runFlow:
    file: subflows/assert-unchecked.yaml
    env:
      ID: 'age-confirmation'
# English only (owner, 2026-10-20).
- assertNotVisible: '.*Je confirme.*'
- takeScreenshot: age-review-terms

# Unticked: "Accept and continue" does nothing, nothing is recorded.
- tapOn:
    id: 'consent-accept'
- assertVisible:
    id: 'screen-consent'
- runScript:
    file: scripts/check-age.js
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
      EXPECT: 'false'

# Ticked: recorded, welcome back on the tabs.
- tapOn:
    id: 'age-confirmation'
- runFlow:
    file: subflows/assert-checked.yaml
    env:
      ID: 'age-confirmation'
- tapOn:
    id: 'consent-accept'
# The welcome-back snackbar shows as soon as the consent is recorded, then the tabs.
- extendedWaitUntil:
    visible: 'Thanks for confirming\. Welcome back!'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'screen-home'
    timeout: 60000
- runScript:
    file: scripts/check-age.js
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
      EXPECT: 'true'
- takeScreenshot: age-review-terms-confirmed

# Never asked again: a relaunch restores the session on the tabs.
- runFlow: subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: 'screen-home'
    timeout: 60000
- assertNotVisible:
    id: 'screen-consent'
