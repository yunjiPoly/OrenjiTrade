# Scrolls down until an element whose text or accessibility label matches the regex TEXT is on
# screen (for rows without a stable id; Android: the same right-edge swipe as scroll-down-to.yaml;
# iOS: until it is clear of the tab bar, see scroll-down-to.yaml).
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          while:
            notVisible: ${TEXT}
          times: 10
          commands:
            - swipe:
                start: 98%, 75%
                end: 98%, 35%
                duration: 500
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element: ${TEXT}
          direction: DOWN
          centerElement: true
          waitToSettleTimeoutMs: 500
          timeout: 40000
