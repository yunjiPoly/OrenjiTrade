name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1" # weekly, Monday 03:30 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read # codeql-action reads workflow-run metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none # scans apps/api without running Gradle
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      # Results are uploaded to Code Scanning only when the repository has GitHub Advanced
      # Security (repository variable CODE_SCANNING_ENABLED=true); otherwise the analysis still
      # runs and the SARIF is kept as a workflow artifact for review.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}
          output: codeql-results
      - name: Keep CodeQL SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-results
          retention-days: 14
          if-no-files-found: ignore
