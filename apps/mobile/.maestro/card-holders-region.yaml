# Who has this card (ADR 0017, stage R5): a seed collector (collector2, Ontario) opens by its link a
# card that collector1 (Quebec) lists publicly in the seed data (read on the host from the public
# API); the one card page lists the holders of Americas (North) grouped by province, collector1's
# copy under Quebec, never a distance. Seed accounts are only signed in to.
appId: ${APP_ID}
name: A card link opens Who has this card, holders grouped by province
tags:
  - mobile-m3
  - map
---
- runScript:
    file: scripts/public-card.js
    env:
      HANDLE: collector1
# The seed predates the 18+ rule: its confirmation is recorded through the API first (the
# onboarding age step is proven by age-step-existing-account.yaml).
- runScript:
    file: scripts/confirm-age.js
    env:
      EMAIL: 'collector2@orenjitrade.test'
      PASSWORD: ${SEED_PASSWORD}
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: 'collector2@orenjitrade.test'
      PASSWORD: ${SEED_PASSWORD}
- extendedWaitUntil:
    visible:
      id: 'screen-search'
    timeout: 60000

# The card (deep link, like a shared https://www.orenjitrade.com/cards/<id>): since stage R5 the
# one card page, Who has this card.
- openLink: ${APP_URL}/--/cards/${output.card.id}
- runFlow: subflows/dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: 'card-name'
      text: ${output.card.name}
    timeout: 60000
- assertVisible:
    id: 'card-tcgplayer'

# The holders of the region grouped by province: collector1's copy under Quebec (collector2 lives
# in Ontario), with the handle only, never a distance or a count.
- runFlow:
    file: subflows/list-scroll-to.yaml
    env:
      ID: 'holders-group-CA-QC'
- assertVisible:
    id: 'holders-group-CA-QC'
    text: 'Quebec'
- runFlow:
    file: subflows/list-scroll-to.yaml
    env:
      ID: 'holder-${output.card.itemId}-collector'
- assertVisible:
    id: 'holder-${output.card.itemId}-collector'
    text: 'collector1, open profile.*'
- assertNotVisible: '.*km away.*'
- takeScreenshot: card-holders-region
