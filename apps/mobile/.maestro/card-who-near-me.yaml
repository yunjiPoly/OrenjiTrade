# "Who has this near me" (mobile Phase 4): a seed collector (collector2, Verdun) opens a card that
# collector1 lists publicly in the seed data (read on the host from the public API), presses "Who
# has this near me", and the Map tab shows only the collectors listing that card, with collector1
# and their listing in the list and the preview. Seed accounts are only signed in to.
appId: host.exp.exponent
name: Card detail to who has this near me
tags:
  - mobile-m3
  - map
---
- runScript:
    file: scripts/public-card.js
    env:
      HANDLE: collector1
# The seed predates the 18+ rule: its confirmation is recorded through the API first (the
# onboarding age step is proven by age-step-existing-account.yaml).
- runScript:
    file: scripts/confirm-age.js
    env:
      EMAIL: 'collector2@orenjitrade.test'
      PASSWORD: ${SEED_PASSWORD}
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: 'collector2@orenjitrade.test'
      PASSWORD: ${SEED_PASSWORD}
- extendedWaitUntil:
    visible:
      id: 'map-status'
      text: '\d+ collectors within 10 km'
    timeout: 60000

# The card (deep link, like a shared https://www.orenjitrade.com/cards/<id>).
- openLink: ${APP_URL}/--/cards/${output.card.id}
- runFlow: subflows/dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: 'card-name'
      text: ${output.card.name}
    timeout: 60000
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'card-who-has-it'
- tapOn:
    id: 'card-who-has-it'

# The map, filtered by the card.
- extendedWaitUntil:
    visible:
      id: 'map-holders'
    timeout: 60000
- assertVisible: 'Who has ${output.card.name} near you'
- extendedWaitUntil:
    visible:
      id: 'map-status'
      text: '\d+ collectors? with this card within 10 km'
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: 'collector-map-loading'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: map-who-has-card
- tapOn:
    id: 'map-view-toggle'
- extendedWaitUntil:
    visible:
      id: 'collector-row-collector1-listings'
    timeout: 30000
- tapOn:
    id: 'collector-row-collector1'
- extendedWaitUntil:
    visible:
      id: 'preview-matching-items'
    timeout: 60000
- takeScreenshot: map-who-has-preview
- back
- extendedWaitUntil:
    notVisible:
      id: 'collector-preview-ready'
    timeout: 30000

# Every collector again.
- tapOn:
    id: 'map-holders-clear'
- extendedWaitUntil:
    notVisible:
      id: 'map-holders'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'map-status'
      text: '\d+ collectors within 10 km'
    timeout: 60000
