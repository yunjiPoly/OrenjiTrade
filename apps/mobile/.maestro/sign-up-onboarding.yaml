# Sign up -> verification -> the welcome -> Home (Phase 1; stage R12 of the phone redesign): a new
# fictional collector (m-<RUN_ID>-maestro-signup-...@mobile-e2e.test) sees "Create account" wait
# for every box with the line saying what is missing, accepts the versioned legal documents with
# "Accept all" and the 18+ confirmation in its own card (never ticked by "Accept all"), verifies the
# email through the local Auth emulator, walks the three welcome steps (the handle's live check,
# Pokémon then Yu-Gi-Oh! with "Opens first" on Pokémon, the place with the pickers: Canada,
# Quebec), stays hidden from the map (discoverability defaults to off) and lands on Home browsing
# the first game picked, Pokémon.
appId: ${APP_ID}
name: Sign up and the welcome
tags:
  - mobile-m1
  - auth
  - onboarding
  - r12
---
- runScript: scripts/new-identity.js
- runFlow: subflows/launch-fresh.yaml
- extendedWaitUntil:
    visible:
      id: 'screen-sign-in'
    timeout: 60000
- assertVisible: 'Find collectors in your region who own, trade or want the cards you care about\.'
- tapOn: 'Create an account'
- extendedWaitUntil:
    visible:
      id: 'screen-sign-up'
    timeout: 30000

# Nothing ticked: Create account waits and says what is missing (the documents come from the API;
# the button sits below them).
- extendedWaitUntil:
    visible: 'Accept all'
    timeout: 30000
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'sign-up-blocker'
- assertVisible:
    id: 'sign-up-blocker'
    text: 'Accept the documents and confirm your age to continue\.'
- runFlow:
    file: subflows/scroll-up-to.yaml
    env:
      ID: 'sign-up-display-name'

- tapOn:
    id: 'sign-up-display-name'
- inputText: 'Maestro Newbie'
- tapOn:
    id: 'sign-up-email'
- inputText: ${output.signup.email}
- tapOn:
    id: 'sign-up-password'
- inputText: ${output.signup.password}
- runFlow: subflows/hide-keyboard.yaml
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'legal-consents-all'
- tapOn:
    id: 'legal-consents-all'
# The 18+ confirmation stays unticked after "Accept all": the line asks for it alone.
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'age-confirmation'
- runFlow:
    file: subflows/assert-unchecked.yaml
    env:
      ID: 'age-confirmation'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'sign-up-blocker'
- assertVisible:
    id: 'sign-up-blocker'
    text: 'Confirm that you are 18 or older to continue\.'
- runFlow:
    file: subflows/scroll-up-to.yaml
    env:
      ID: 'age-confirmation'
- tapOn:
    id: 'age-confirmation'
- runFlow:
    file: subflows/assert-checked.yaml
    env:
      ID: 'age-confirmation'
# A document unticked again: the line asks for the documents alone.
- runFlow:
    file: subflows/scroll-up-to.yaml
    env:
      ID: 'legal-consents-TERMS'
- tapOn:
    id: 'legal-consents-TERMS'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'sign-up-blocker'
- assertVisible:
    id: 'sign-up-blocker'
    text: 'Accept every document to continue\.'
- runFlow:
    file: subflows/scroll-up-to.yaml
    env:
      ID: 'legal-consents-TERMS'
- tapOn:
    id: 'legal-consents-TERMS'
# Every box ticked: no line, and the account is created.
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'sign-up-submit'
- assertNotVisible:
    id: 'sign-up-blocker'
- takeScreenshot: sign-up-every-box
- tapOn:
    id: 'sign-up-submit'

# Email verification through the emulator's out-of-band code.
- extendedWaitUntil:
    visible:
      id: 'screen-verify-email'
    timeout: 60000
- assertVisible: 'Check your inbox'
- runScript:
    file: scripts/verify-email.js
    env:
      EMAIL: ${output.signup.email}
- tapOn:
    id: 'verify-check'

# Welcome, step 1 of 3: "Who are you?", prefilled with the display name and the handle the API
# derived, which the live check finds the collector's own (a teal check).
- extendedWaitUntil:
    visible:
      id: 'onboarding-profile'
    timeout: 60000
- assertVisible: 'Step 1 of 3'
- assertVisible:
    id: 'profile-display-name'
    text: 'Maestro Newbie'
- extendedWaitUntil:
    visible:
      id: 'handle-available'
    timeout: 15000
- takeScreenshot: welcome-step-1
# The keyboard never hides the field being typed in (stage R12's review fix 1): with the keyboard
# up for the display name, the bio is tapped where it shows and typed in. Before the fix the
# pinned Continue and Sign out sat over it, and this tap signed the collector out.
- tapOn:
    id: 'profile-display-name'
- tapOn:
    id: 'profile-bio'
- inputText: 'Fictional bio typed with the keyboard up.'
- takeScreenshot: welcome-step-1-bio-keyboard
- assertVisible:
    id: 'onboarding-profile'
- runFlow: subflows/hide-keyboard.yaml
- assertVisible: 'Fictional bio typed with the keyboard up\.'
- tapOn:
    id: 'onboarding-profile-continue'

# Step 2 of 3: "What do you collect?": at least one game; the first picked opens first.
- extendedWaitUntil:
    visible:
      id: 'onboarding-interests'
    timeout: 30000
- assertVisible: 'Step 2 of 3'
- assertVisible:
    id: 'interests-missing'
    text: 'Choose at least one game\.'
- tapOn:
    id: 'game-pokemon'
- tapOn:
    id: 'game-yugioh'
- assertVisible:
    id: 'game-pokemon-note'
    text: 'Opens first'
- assertNotVisible:
    id: 'interests-missing'
- takeScreenshot: welcome-step-2
- tapOn:
    id: 'onboarding-interests-continue'

# Step 3 of 3: "Where do you ship from?" The pickers fed by GET /regions (Canada, then Quebec): no
# map, no GPS (ADR 0017); the map opt-in stays off.
- extendedWaitUntil:
    visible:
      id: 'onboarding-location'
    timeout: 30000
- assertVisible: 'Step 3 of 3'
- extendedWaitUntil:
    visible:
      id: 'location-country'
    timeout: 30000
# Finish without a country: what is missing shows under the pickers, in view (review fix 1).
- tapOn:
    id: 'onboarding-finish'
- assertVisible:
    id: 'location-missing'
    text: '.*Choose your country\.'
- takeScreenshot: welcome-step-3-missing-country
- tapOn:
    id: 'location-country'
- scrollUntilVisible:
    element:
      id: 'location-country-option-CA'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'location-country-option-CA'
- extendedWaitUntil:
    visible:
      id: 'location-subdivision'
    timeout: 15000
- tapOn:
    id: 'location-subdivision'
- scrollUntilVisible:
    element:
      id: 'location-subdivision-option-CA-QC'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'location-subdivision-option-CA-QC'
- takeScreenshot: sign-up-location-step
# The city field shows above the keyboard while it is typed in (review fix 1).
- tapOn:
    id: 'location-city'
- takeScreenshot: welcome-step-3-city-keyboard
- runFlow: subflows/hide-keyboard.yaml
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'onboarding-discoverable'
- runFlow:
    file: subflows/assert-unchecked.yaml
    env:
      ID: 'onboarding-discoverable'
- tapOn:
    id: 'onboarding-finish'

# Home, browsing the first game picked (Pokémon), then the profile of the new collector, hidden
# from the map.
- extendedWaitUntil:
    visible:
      id: 'screen-home'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'home-game'
      text: 'Game: Pokémon\. Change game'
    timeout: 30000
- takeScreenshot: sign-up-home-first-game
- runFlow: subflows/open-profile-tab.yaml
- assertVisible:
    id: 'profile-name'
    text: 'Maestro Newbie'
- assertVisible:
    id: 'profile-handle-label'
    text: '@.+'
# Not discoverable yet (the default): the Profile tab, the page others see (stage R6), has no
# public place; its line says so and links to Location.
- assertVisible:
    id: 'profile-line'
    text: 'Not on the map · Member since \d{4}'
- takeScreenshot: sign-up-onboarded-profile
