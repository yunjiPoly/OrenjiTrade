# ---------------------------------------------------------------------------------------------
# OrenjiTrade API configuration.
#
# Environment variables mirror /.env.example (DATABASE_URL, REDIS_URL, CORS_ALLOWED_ORIGINS, ...).
# Profiles: local (default) | dev | staging | prod | test. Profile documents follow the base one.
# Never put secrets here; everything sensitive is injected through the environment.
# ---------------------------------------------------------------------------------------------
spring:
  application:
    name: orenjitrade-api
  profiles:
    default: local
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
    contentnegotiation:
      favor-parameter: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    # Jackson 3 writes java.time values as ISO-8601 strings by default (DateTimeFeature); kept
    # explicit so a future default change cannot silently switch the API to epoch numbers.
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orenjitrade}
    username: ${DATABASE_USERNAME:orenjitrade}
    password: ${DATABASE_PASSWORD:orenjitrade_local}
    hikari:
      pool-name: orenji-db
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      # Cache, rate limits, presence and realtime fan-out only, never primary storage (CLAUDE.md).
      # Locally the docker compose Redis; in the cloud the Valkey sidecar of the single Cloud Run
      # instance (redis://localhost:6379, no persistence: everything here may vanish on a restart,
      # ADR 0016). Lettuce reconnects on its own when the server restarts; the readiness group
      # below keeps the instance out of rotation until Redis answers again.
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
  modulith:
    events:
      jdbc:
        schema-initialization:
          # The event_publication table is created by V002__event_publication.sql.
          enabled: false
      republish-outstanding-events-on-restart: true
      completion-mode: update
  web:
    error:
      whitelabel:
        enabled: false
      include-stacktrace: never
      include-message: never
      include-exception: false
  autoconfigure:
    exclude:
      # Identity comes from Firebase ID tokens (auth module); no generated in-memory user.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:${PORT:8080}}
  # Trust X-Forwarded-* from Cloudflare / the Google load balancer (the rate limiter then keys
  # anonymous requests by request.getRemoteAddr()).
  forward-headers-strategy: native
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # /actuator/health/liveness: the JVM is alive; never depends on infrastructure.
        liveness:
          include: livenessState,ping
        # /actuator/health/readiness: the instance can serve traffic.
        readiness:
          include: readinessState,db,redis
  info:
    build:
      enabled: true
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false

springdoc:
  api-docs:
    enabled: ${orenji.openapi.enabled}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${orenji.openapi.enabled}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  # The servlet error dispatch target is not part of the contract (it is also @Hidden).
  paths-to-exclude: /error
  default-produces-media-type: application/json
  show-actuator: false
  writer-with-default-pretty-printer: true

logging:
  level:
    root: INFO
    com.orenjitrade: INFO

# --- OrenjiTrade settings (bound by records in com.orenjitrade.api.config and the modules) ------
orenji:
  # local | development | staging | production | test (reported by GET /api/v1/meta)
  environment: ${ORENJI_ENV:local}
  openapi:
    # springdoc + Swagger UI. true for local/dev/test, false for staging/prod (see profiles).
    enabled: false
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081,http://localhost:19006}
    hsts:
      enabled: true
    admin:
      # /api/v1/admin/** additionally requires an ID token issued after a second factor.
      require-mfa: true
    # Shared secret accepted as X-Service-Token on /internal/** (Cloud Scheduler, Pub/Sub, ML).
    # The default only works locally; staging/prod refuse to start with it (see profiles below).
    service-token: ${SERVICE_TOKEN:local-service-token}
    # Google OIDC alternative for /internal/**: expected audience (the Cloud Run URL) and the
    # service-account emails allowed to invoke. Empty audience disables the OIDC path.
    internal-audience: ${INTERNAL_AUDIENCE:}
    internal-invokers: ${INTERNAL_INVOKERS:}
  consents:
    # Server-side salt for the SHA-256 hash of the client IP stored with each consent.
    ip-salt: ${CONSENT_IP_SALT:local-consent-salt}
  async:
    core-size: 4
    max-size: 16
    queue-capacity: 500
  realtime:
    # Redis pub/sub channel prefix of the realtime fan-out (<prefix><userId>). Pub/sub ignores the
    # logical database, so the local E2E API (Redis db 2) sets its own prefix next to npm run dev.
    channel-prefix: "${REALTIME_CHANNEL_PREFIX:rt:user:}"
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:orenjitrade-local}
    # Empty => Application Default Credentials against the real project.
    auth-emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
  google-cloud:
    project: ${GOOGLE_CLOUD_PROJECT:}
    region: ${GOOGLE_CLOUD_REGION:northamerica-northeast1}
  events:
    # local (in-process, transactional outbox) | pubsub
    transport: ${EVENTS_TRANSPORT:local}
    pubsub:
      emulator-host: ${PUBSUB_EMULATOR_HOST:}
      topic-domain-events: ${PUBSUB_TOPIC_DOMAIN_EVENTS:domain-events}
      topic-analytics: ${PUBSUB_TOPIC_ANALYTICS:analytics-events}
  analytics:
    # Analytics events (ARCHITECTURE.md section 8): written to the log with EVENTS_TRANSPORT=local,
    # published to the Pub/Sub topic analytics-events with EVENTS_TRANSPORT=pubsub (cloud only).
    enabled: true
    # HMAC key pseudonymising account ids (actor_hash). No default outside the local and test
    # profiles: the application refuses to start without it.
    actor-salt: ${ANALYTICS_ACTOR_SALT:}
  search:
    # Region search and the map (ADR 0017): technical defaults. Regions, countries and
    # subdivisions are data (GET /regions, /admin/regions).
    discovery-cache-ttl: 60s
    matching-items-per-collector: 5
  storage:
    # local | gcs
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:./.local-storage}
    # Origin of public media URLs. Empty: local media is served by this API
    # (GET /api/v1/public/media/{key}) and URLs are built from the current request origin; with
    # STORAGE_PROVIDER=gcs it defaults to https://storage.googleapis.com/<bucket>.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    gcs-bucket-media: ${GCS_BUCKET_MEDIA:}
  card-images:
    # Capped card image cache (ADR 0015). Card metadata lives in PostgreSQL; only the image
    # renditions are cached, never more than max-mb MiB (default and hard ceiling 5120 = 5 GB,
    # owner decision 2026-10-04: larger values stop the start-up, smaller values are allowed).
    cache:
      max-mb: ${CARD_IMAGE_LOCAL_CACHE_MAX_MB:5120}
      # Where the renditions live. Empty: the media provider (STORAGE_PROVIDER). local: files under
      # `dir` (one directory per database; reconciliation deletes files no row references). gcs:
      # objects under `object-prefix` of the media bucket (GCS_BUCKET_MEDIA) or of `gcs-bucket`,
      # because Cloud Run wipes its local disk on every restart. Temporary download files always
      # stay under `dir`.
      provider: ${CARD_IMAGE_STORAGE_PROVIDER:}
      gcs-bucket: ${CARD_IMAGE_GCS_BUCKET:}
      object-prefix: ${CARD_IMAGE_OBJECT_PREFIX:card-images/}
      dir: ${CARD_IMAGE_CACHE_DIR:${orenji.storage.local-root}/card-images}
      # One rendition per artwork: JPEG (the JVM has no WebP encoder), 320 px wide, never upscaled.
      target-width: 320
      jpeg-quality: 0.82
      max-download-size: 2MB
      max-parallel-downloads: 4
      reservation-ttl: 10m
      download-timeout: 60s
    on-demand:
      # GET /api/v1/public/card-images/{id} may fill the cache for a not yet cached artwork.
      enabled: ${CARD_IMAGE_ON_DEMAND_ENABLED:true}
      wait-timeout: 3s
      max-per-second: 2
  card-providers:
    ygoprodeck:
      # Real Yu-Gi-Oh! catalog (docs/providers/ygoprodeck.md). Imported only on request
      # (npm run catalog:import, POST /admin/catalog/sync); the start-up seed stays on the mock.
      enabled: ${YGOPRODECK_ENABLED:true}
      game-slug: yugioh
      api-base-url: ${YGOPRODECK_API_BASE_URL:https://db.ygoprodeck.com/api/v7/}
      image-base-url: ${YGOPRODECK_IMAGE_BASE_URL:https://images.ygoprodeck.com/images/cards/}
      # Provider limit 20/s (IP blocked for an hour above it); refused above 15.
      requests-per-second: ${YGOPRODECK_REQUESTS_PER_SECOND:5}
      # Raw JSON snapshots per database version (git-ignored), reused while the version is unchanged.
      snapshot-dir: ${PROVIDER_DATA_DIR:./.local-dev/provider-data}/ygoprodeck
      snapshot-only: ${YGOPRODECK_SNAPSHOT_ONLY:false}
  account:
    # A deletion request needs an ID token whose auth_time is younger than this (401 otherwise).
    reauth-window: 5m
    # Grace period between the deletion request and the anonymising job.
    deletion-grace-days: 7
  payments:
    # fake | stripe (ADR 0011). fake needs no credentials; stripe needs both STRIPE_* secrets.
    provider: ${PAYMENT_PROVIDER:fake}
    fake:
      # HMAC key of the fake provider's synthetic webhooks (X-Fake-Signature); not a real secret.
      webhook-secret: ${FAKE_PAYMENTS_WEBHOOK_SECRET:local-fake-payments-webhook-secret}
      # Empty: checkout URLs are the web path /checkout/fake/<ref>.
      checkout-base-url: ${FAKE_CHECKOUT_BASE_URL:}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      web-base-url: ${WEB_BASE_URL:https://www.orenjitrade.com}
  billing:
    # Phase 10 subscriptions: fake | stripe. fake needs no credentials; stripe needs
    # STRIPE_SECRET_KEY, STRIPE_BILLING_WEBHOOK_SECRET and a Stripe price id per paid plan.
    provider: ${BILLING_PROVIDER:fake}
    # A real provider's subscription without a renewal webhook expires this long after its period.
    renewal-grace: 3d
    fake:
      # HMAC key of the fake billing provider's synthetic webhooks; not a real secret.
      webhook-secret: ${FAKE_BILLING_WEBHOOK_SECRET:local-fake-billing-webhook-secret}
      # Empty: checkout URLs are the web path /checkout/fake-billing/<ref>.
      checkout-base-url: ${FAKE_CHECKOUT_BASE_URL:}
      period: 30d
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_BILLING_WEBHOOK_SECRET:}
      web-base-url: ${WEB_BASE_URL:https://www.orenjitrade.com}
      price-ids:
        "[PREMIUM]": ${STRIPE_PRICE_PREMIUM:}
  donations:
    # Phase 10 voluntary donations: only fake exists (no credentials, no money).
    provider: ${DONATION_PROVIDER:fake}
    fake:
      webhook-secret: ${FAKE_DONATIONS_WEBHOOK_SECRET:local-fake-donations-webhook-secret}
      # Empty: checkout URLs are the web path /checkout/fake-donation/<ref>.
      checkout-base-url: ${FAKE_CHECKOUT_BASE_URL:}
  ads:
    # HMAC key of the ad serve tokens (impressions and clicks). The development default is refused
    # outside the local, test and dev profiles.
    token-secret: ${ADS_TOKEN_SECRET:local-ads-token-secret}
    token-max-age: 24h
    # Origin of relative house-ad landing paths (e.g. /premium) on click redirects.
    web-base-url: ${ADS_WEB_BASE_URL:http://localhost:4200}
  push:
    # log | fcm
    provider: ${PUSH_PROVIDER:log}
  email:
    # log | sendgrid | ses
    provider: ${EMAIL_PROVIDER:log}
    from: ${EMAIL_FROM:no-reply@orenjitrade.com}
  ml:
    service-url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${ML_SERVICE_TIMEOUT_MS:1500}
  seed:
    # SeedDataRunner: fictional accounts (+ emulator users) for local/dev only.
    enabled: false
    emulator-password: ${SEED_EMULATOR_PASSWORD:LocalDev!2026}
  ratelimit:
    # Fixed windows in Redis. First matching policy wins, so specific ones come first.
    # Contract table: docs/api/contracts/phase1-auth-users.md#rate-limiting
    enabled: true
    policies:
      - name: avatar-upload
        path-patterns: ["/api/v1/me/profile/avatar"]
        methods: [POST]
        limit: 10
        window-seconds: 3600
        key-by: USER
      - name: inventory-image-upload
        path-patterns: ["/api/v1/inventory/items/*/images"]
        methods: [POST]
        limit: 60
        window-seconds: 3600
        key-by: USER
      - name: image-upload
        path-patterns: ["/api/v1/uploads/images"]
        methods: [POST]
        limit: 30
        window-seconds: 3600
        key-by: USER
      - name: export
        path-patterns: ["/api/v1/me/export"]
        methods: [GET]
        limit: 10
        window-seconds: 3600
        key-by: USER
      - name: deletion-requests
        path-patterns: ["/api/v1/me/deletion-requests", "/api/v1/me/deletion-requests/**"]
        limit: 5
        window-seconds: 86400
        key-by: USER
      - name: tags-search
        path-patterns: ["/api/v1/tags"]
        methods: [GET]
        limit: 60
        window-seconds: 60
        key-by: USER
      - name: payment-webhooks
        path-patterns: ["/api/v1/webhooks/payments/*"]
        methods: [POST]
        limit: 600
        window-seconds: 60
        key-by: IP
      - name: billing-webhooks
        path-patterns: ["/api/v1/webhooks/billing/*", "/api/v1/webhooks/donations/*"]
        methods: [POST]
        limit: 600
        window-seconds: 60
        key-by: IP
      - name: ad-events
        path-patterns: ["/api/v1/ads/*/impression", "/api/v1/ads/*/click"]
        limit: 600
        window-seconds: 60
        key-by: IP
      - name: card-images
        # Card pictures (cached artworks and placeholders): a page shows dozens of them.
        path-patterns: ["/api/v1/public/card-images/*", "/api/v1/public/placeholder-images/**"]
        methods: [GET]
        limit: ${RATE_LIMIT_CARD_IMAGES_PER_MINUTE:600}
        window-seconds: 60
        key-by: IP
      - name: default-authenticated
        path-patterns: ["/api/**"]
        limit: ${RATE_LIMIT_DEFAULT_PER_MINUTE:120}
        window-seconds: 60
        key-by: USER
      - name: default-anonymous
        path-patterns: ["/api/**"]
        limit: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:60}
        window-seconds: 60
        key-by: IP

---
# --- local: developer machine against docker compose ------------------------------------------
spring:
  config:
    activate:
      on-profile: local
orenji:
  environment: ${ORENJI_ENV:local}
  openapi:
    enabled: true
  security:
    hsts:
      enabled: false
    admin:
      require-mfa: false
  firebase:
    auth-emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:localhost:9099}
  analytics:
    actor-salt: ${ANALYTICS_ACTOR_SALT:local-analytics-salt}
  seed:
    enabled: true
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%X{requestId:-}]){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    com.orenjitrade: DEBUG

---
# --- dev: shared development environment on Google Cloud --------------------------------------
spring:
  config:
    activate:
      on-profile: dev
orenji:
  environment: ${ORENJI_ENV:development}
  openapi:
    enabled: true
  seed:
    enabled: true
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${orenji.environment}

---
# --- staging ----------------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: staging
orenji:
  environment: ${ORENJI_ENV:staging}
  openapi:
    enabled: false
  security:
    # No default: ServiceTokenStartupValidator fails the start-up when SERVICE_TOKEN is unset.
    service-token: ${SERVICE_TOKEN:}
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${orenji.environment}

---
# --- prod -------------------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      # Cloud SQL db-g1-small (first-year profile, ADR 0016) has max_connections = 50: one api
      # instance with a pool of 10 (Flyway shares it) plus superuser_reserved_connections (3),
      # Cloud SQL's own sessions and admin headroom stays far below it. Raise DATABASE_POOL_SIZE
      # together with the tier (and the sql_connection_alert_threshold in Terraform).
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
orenji:
  environment: ${ORENJI_ENV:production}
  openapi:
    enabled: false
  security:
    service-token: ${SERVICE_TOKEN:}
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${orenji.environment}
  level:
    com.orenjitrade: INFO

---
# --- test: integration tests (Testcontainers supply the datasource and Redis) -------------------
spring:
  config:
    activate:
      on-profile: test
orenji:
  environment: test
  openapi:
    enabled: true
  security:
    cors:
      allowed-origins: http://localhost:4200,http://localhost:8081
    hsts:
      enabled: false
    admin:
      require-mfa: false
    internal-invokers: scheduler@orenjitrade-test.iam.gserviceaccount.com
  firebase:
    auth-emulator-host: ""
  analytics:
    actor-salt: ${ANALYTICS_ACTOR_SALT:local-analytics-salt}
  storage:
    # Each test JVM gets its own media root (deleted by the OS); never the repository directory.
    local-root: ${java.io.tmpdir}/orenjitrade-test-media
  card-images:
    cache:
      # AbstractIntegrationTest sets CARD_IMAGE_CACHE_DIR to one directory per test JVM.
      reconcile-on-startup: true
  card-providers:
    ygoprodeck:
      # Tests never touch the network: closed local ports unless a test points them at its stub.
      api-base-url: http://127.0.0.1:9/api/v7/
      image-base-url: http://127.0.0.1:9/images/cards/
      snapshot-dir: ${java.io.tmpdir}/orenjitrade-test-provider-data/ygoprodeck
      initial-backoff: 10ms
      max-backoff: 40ms
  seed:
    enabled: false
  ratelimit:
    # Off by default; RateLimitIT switches it on with a tiny policy.
    enabled: false
management:
  endpoint:
    health:
      # Expose component statuses (not details) so readiness tests can assert db + redis.
      show-components: always
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] --- [%15.15t] %-40.40logger{39} : %m%n%wEx"
  level:
    com.orenjitrade: DEBUG
    org.testcontainers: INFO
