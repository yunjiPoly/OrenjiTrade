# Collector search and "Looking for" (mobile stage M7, ADR 0017; the card search's Collectors
# since stage R5): Wren (fresh, fictional, discoverable, in Quebec) types Hal's name in the card
# search of Search (Hal in Wyoming,
# the same platform region; name search allowed, wishlist shown on his profile; scripts/parity.js),
# opens his profile from the result (his state only, never a distance) and reads what he is
# looking for; the wish opens the card.
appId: ${APP_ID}
name: Collector search, profile and Looking for
tags:
  - mobile-m7
  - mobile-r5
  - search
---
- runScript:
    file: scripts/parity.js
    env:
      ACTION: looking-for
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.wren.email}
      PASSWORD: ${output.wren.password}
- extendedWaitUntil:
    visible:
      id: 'screen-search'
    timeout: 60000

# The card search (stage R5): collectors whose name matches show under the cards, at most three,
# with their state only. Two letters first: the field keeps what is typed next.
- tapOn:
    id: 'search-field'
- extendedWaitUntil:
    visible:
      id: 'search-input'
    timeout: 30000
- inputText: ${output.hal.displayName.slice(0, 2)}
- inputText: ${output.hal.displayName.slice(2)}
- assertVisible:
    id: 'search-input'
    text: ${output.hal.displayName}
- runFlow: subflows/hide-keyboard.yaml
- extendedWaitUntil:
    visible:
      id: 'search-collector-${output.hal.handle}'
    timeout: 60000
- assertVisible:
    id: 'search-collectors'
- assertVisible:
    id: 'search-collector-${output.hal.handle}'
    text: '.*Wyoming.*'
- assertNotVisible: '.*km away.*'
- takeScreenshot: search-collectors

# His profile, then "Looking for" with the Emberfang Fox wish (condition only, no price, no radius).
- tapOn:
    id: 'search-collector-${output.hal.handle}'
- extendedWaitUntil:
    visible:
      id: 'collector-name'
      text: ${output.hal.displayName}
    timeout: 60000
# The section sits at the bottom of the profile; its top edge shows before its text does.
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'collector-wishlist'
- runFlow:
    file: subflows/scroll-down-to-text.yaml
    env:
      TEXT: '1 card ${output.hal.displayName} is looking for'
- assertVisible: '1 card ${output.hal.displayName} is looking for'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'collector-wish-${output.card.id}'
- assertVisible:
    id: 'collector-wish-${output.card.id}'
    text: '.*Near Mint only.*'
# The wish's public note and its price term are shown (a wish has no private price any more).
- assertVisible:
    id: 'collector-wish-${output.card.id}'
    text: '.*Fictional Maestro wish.*'
- assertVisible:
    id: 'collector-wish-${output.card.id}'
    text: '.*85% TCG.*'
- takeScreenshot: collector-looking-for
- tapOn:
    id: 'collector-wish-${output.card.id}'
- extendedWaitUntil:
    visible:
      id: 'card-name'
      text: ${output.card.name}
    timeout: 60000
