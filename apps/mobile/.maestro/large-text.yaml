# The largest text size (mobile stage M9, review fix 1; Search of stage R5): a seed collector of
# Americas (North) (collector1, Quebec) reopens the app at the last accessibility size of iOS
# (subflows/relaunch-large-text.yaml; an Android device keeps its own size and walks the same
# paths). On Search the title, the segments and the field stay within reach above the map, the
# card of the collector's province shows under the map, and a finger dragged over the whole region
# scrolls the page down to the note under it; a card that is typed is narrowed to its game and
# opened; in Europe the "Not your region" line stands under the field, and a collector who is
# typed is found and opened; one press goes home.
# Seed accounts are only signed in to; who lives in Île-de-France is read on the host from the
# public API (scripts/region-map.js).
appId: ${APP_ID}
name: Largest text size, Search's map, the card search and the collectors stay within reach
tags:
  - mobile-m9
  - mobile-r5
  - search
  - map
  - large-text
---
- runScript:
    file: scripts/region-map.js
    env:
      REGION: europe
      CODE: FR-IDF
      BINDER: 'Extras for trade'
      GAME: pokemon
- runScript:
    file: scripts/confirm-age.js
    env:
      EMAIL: ${SEED_EMAIL}
      PASSWORD: ${SEED_PASSWORD}
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${SEED_EMAIL}
      PASSWORD: ${SEED_PASSWORD}
- extendedWaitUntil:
    visible:
      id: 'screen-home'
    timeout: 60000
- runFlow: subflows/relaunch-large-text.yaml
- runFlow: subflows/open-search-tab.yaml
- extendedWaitUntil:
    visible:
      id: 'search-field'
    timeout: 60000
- assertVisible:
    id: 'search-segment-cards'
- assertVisible:
    id: 'search-segment-binders'
- assertVisible:
    id: 'search-segment-wishlist'
# iOS: the text really is that large. The field is one line of about 52 points at the default
# size and well over a hundred at this one (heights are in points); without this the flow would
# pass at the default size if the launch argument stopped working.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: 'search-title'
          height: 80
          tolerance: 40
- takeScreenshot: large-text-search

# The map opens on the collector's province (zoomed in: a finger on it moves the map). At this
# size its card stands under the map, which keeps its smallest height, so the card's top is in
# view without scrolling.
- extendedWaitUntil:
    visible:
      id: 'search-state-name'
      text: 'Quebec'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'search-region-map-zoom-out'
      enabled: true
    timeout: 15000
- takeScreenshot: large-text-province-card
# Zoomed out to the whole region, a finger dragged over the map scrolls the page on, down to the
# note under the map.
- repeat:
    while:
      visible:
        id: 'search-region-map-zoom-out'
        enabled: true
    times: 6
    commands:
      - tapOn:
          id: 'search-region-map-zoom-out'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'search-region-map'
- swipe:
    from:
      id: 'search-region-map'
    direction: UP
    duration: 600
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'search-map-privacy'
- assertVisible:
    id: 'search-map-privacy'
- takeScreenshot: large-text-map-scrolled
- runFlow:
    file: subflows/scroll-up-to.yaml
    env:
      ID: 'search-field'

# A card of the browsed game is typed and opened. At this size a result is about a third of the
# screen tall (its name wraps) and the list scrolls under the field. Pokémon first, with the game
# pill (stage G: the card search shows the browsed game's cards only; the sheet at this size).
- tapOn:
    id: 'search-game'
- extendedWaitUntil:
    visible:
      id: 'search-game-sheet-title'
    timeout: 15000
- takeScreenshot: large-text-game-sheet
# At this size the sheet's title, its line and the rows scroll together.
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'search-game-sheet-option-pokemon'
- tapOn:
    id: 'search-game-sheet-option-pokemon'
- extendedWaitUntil:
    visible:
      id: 'search-game'
      text: 'Game: Pokémon\. Change game'
    timeout: 15000
- tapOn:
    id: 'search-field'
- extendedWaitUntil:
    visible:
      id: 'search-input'
    timeout: 30000
- inputText: 'emberfang fox'
- runFlow: subflows/hide-keyboard.yaml
# (The field holds the typed words too: the result rows are found by their ids.)
- extendedWaitUntil:
    visible:
      id: 'search-result-.*'
    timeout: 30000
- takeScreenshot: large-text-typing
# The best match comes first: Emberfang Fox, then Emberfang Fox VMAX.
- tapOn:
    id: 'search-result-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'card-name'
      text: 'Emberfang Fox'
    timeout: 60000
- takeScreenshot: large-text-card-page
- runFlow: subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: 'search-input'
    timeout: 30000
- tapOn:
    id: 'search-input-cancel'

# Another region: its name, and "Not your region" under the field.
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'search-region'
- tapOn:
    id: 'search-region'
# "Choose a region" (stage G, screen 35): at this size its title and line come first, the rows
# under them.
- extendedWaitUntil:
    visible:
      id: 'search-region-sheet-title'
    timeout: 15000
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'search-region-option-europe'
- tapOn:
    id: 'search-region-option-europe'
- runFlow:
    file: subflows/scroll-up-to.yaml
    env:
      ID: 'search-region-away-home'
- assertVisible:
    id: 'search-region-away-home'
    text: 'Back to Americas \(North\)'
- takeScreenshot: large-text-search-europe

# A collector of Europe is typed, found under the cards and opened.
- runFlow:
    file: subflows/scroll-up-to.yaml
    env:
      ID: 'search-field'
- tapOn:
    id: 'search-field'
- extendedWaitUntil:
    visible:
      id: 'search-input'
    timeout: 30000
- inputText: ${output.binder.handle}
- runFlow: subflows/hide-keyboard.yaml
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'search-collector-${output.binder.handle}'
- takeScreenshot: large-text-search-collector-row
- tapOn:
    id: 'search-collector-${output.binder.handle}'
- extendedWaitUntil:
    visible:
      id: 'collector-name'
      text: ${output.binder.owner}
    timeout: 60000
- runFlow: subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: 'search-input'
    timeout: 30000

# One press goes home, from the line under the field.
- tapOn:
    id: 'search-input-cancel'
- runFlow:
    file: subflows/scroll-up-to.yaml
    env:
      ID: 'search-region-away-home'
- tapOn:
    id: 'search-region-away-home'
- extendedWaitUntil:
    notVisible:
      id: 'search-region-away-home'
    timeout: 30000
