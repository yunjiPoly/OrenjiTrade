# Signs in through the sign-in screen (empty fields: right after launch-fresh) with EMAIL /
# PASSWORD and waits until the app left it. Since stage R15 the app opens on Home as a guest: Sign
# in is opened with the person button first (open-sign-in.yaml), unless it is already on screen.
appId: ${APP_ID}
---
- runFlow: open-sign-in.yaml
- tapOn:
    id: 'sign-in-email'
- inputText: ${EMAIL}
- tapOn:
    id: 'sign-in-password'
- inputText: ${PASSWORD}
- runFlow: hide-keyboard.yaml
- tapOn:
    id: 'sign-in-submit'
- extendedWaitUntil:
    notVisible:
      id: 'screen-sign-in'
    timeout: 60000
