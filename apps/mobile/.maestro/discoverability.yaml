# Location and discoverability (ADR 0017): a fresh collector is hidden by default and has no
# location; they say where they are with the pickers fed by GET /regions (country, then state or
# province, an optional city), save, then opt into the map. No map, no GPS: the app shows the
# API's label ("Ontario, Canada"), and scripts/check-location.js checks on the host that the API
# holds the declared codes and the city, and no coordinate, radius or distance field.
appId: host.exp.exponent
name: Location and discoverability
tags:
  - mobile-m1
  - location
---
- runScript:
    file: scripts/create-collector.js
    env:
      PREFIX: area
      DISPLAY_NAME: Maestro Placer
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
- runFlow: subflows/open-profile-tab.yaml
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'profile-visibility'
- assertVisible:
    id: 'profile-visibility'
    text: 'Hidden from the map.'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'profile-location'
- tapOn:
    id: 'profile-location'
- extendedWaitUntil:
    visible:
      id: 'location-none'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'location-country'
    timeout: 30000

# The pickers: Canada, then Ontario (the sheets scroll to the option), then a city.
- tapOn:
    id: 'location-country'
- scrollUntilVisible:
    element:
      id: 'location-country-option-CA'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'location-country-option-CA'
- extendedWaitUntil:
    visible:
      id: 'location-subdivision'
    timeout: 15000
- tapOn:
    id: 'location-subdivision'
- scrollUntilVisible:
    element:
      id: 'location-subdivision-option-CA-ON'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'location-subdivision-option-CA-ON'
- tapOn:
    id: 'location-city'
- inputText: 'Ottawa'
- hideKeyboard
- takeScreenshot: discoverability-pickers
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'location-save'
- tapOn:
    id: 'location-save'
- extendedWaitUntil:
    visible: 'Location saved · Ontario, Canada.*'
    timeout: 30000
- runScript:
    file: scripts/check-location.js
    env:
      EMAIL: ${output.collector.email}
      PASSWORD: ${output.collector.password}
      COUNTRY: 'CA'
      SUBDIVISION: 'CA-ON'
      CITY: 'Ottawa'
- runFlow:
    file: subflows/scroll-up-to.yaml
    env:
      ID: 'location-label'
- assertVisible:
    id: 'location-label'
    text: 'Ontario, Canada · Americas \(North\)'

# Hidden by default, then opt into the map.
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'location-visibility'
- assertVisible:
    id: 'location-visibility'
    text: 'You are hidden from the map.*'
- assertVisible:
    id: 'location-discoverable'
    checked: false
- tapOn:
    id: 'location-discoverable'
- extendedWaitUntil:
    visible: 'You now appear on the map.'
    timeout: 30000
- assertVisible:
    id: 'location-discoverable'
    checked: true
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'location-visibility'
- assertVisible:
    id: 'location-visibility'
    text: 'Collectors see you in Ontario, Canada.'
- takeScreenshot: discoverability-on
