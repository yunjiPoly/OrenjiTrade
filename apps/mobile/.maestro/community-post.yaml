# Messages › Community (stage R11, owner prompt 2026-10-20, mockup v50 screens 32 and 33): Ada, a
# fresh fictional collector, opens Messages › Community (Chats | Community), sees the five rooms of
# Americas (North), opens the Yu-Gi-Oh! room, reads its rules, posts a few words with a photo, and
# reports Bo's post (Bo, fresh and fictional, posted it through the API: scripts/reports.js). The
# host scripts check what the isolated API holds: the post and its one photo (scripts/community.js)
# and Ada's open report (scripts/reports.js).
#
# The photo is the fictional picture of native flow 1 (media/fictional-card-photo.jpg, 600 × 800),
# put in the simulator's photo library by `addMedia` and picked as the newest photo
# (subflows/pick-newest-photo.yaml; see inventory-add-edit-undo.yaml). The room keeps the posts of
# earlier runs, so the texts carry the run's unique handles.
appId: ${APP_ID}
name: Open the Yu-Gi-Oh! room, post with a photo, report a post
tags:
  - mobile-r11
  - community
---
- runScript:
    file: scripts/reports.js
    env:
      ACTION: community
      SLUG: americas-north-yugioh
- addMedia:
    - media/fictional-card-photo.jpg
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.ada.email}
      PASSWORD: ${output.ada.password}
- extendedWaitUntil:
    visible:
      id: 'tab-messages'
    timeout: 60000
- tapOn:
    id: 'tab-messages'
- extendedWaitUntil:
    visible:
      id: 'messages-view-community'
    timeout: 60000
- tapOn:
    id: 'messages-view-community'
- extendedWaitUntil:
    visible:
      id: 'room-americas-north-yugioh'
    timeout: 60000
- assertVisible:
    id: 'room-americas-north-pokemon'
- assertVisible:
    id: 'room-preview-americas-north-yugioh'
    text: '${output.bo.handle}: ${output.boPost.body}'
- takeScreenshot: community-rooms
- tapOn:
    id: 'room-americas-north-yugioh'
- extendedWaitUntil:
    visible:
      id: 'room-subtitle'
      text: 'Americas \(North\) · public room'
    timeout: 60000
- assertVisible:
    id: 'room-banner'
- extendedWaitUntil:
    visible:
      id: 'room-post-more-${output.boPost.id}'
    timeout: 60000

# The room rules.
- tapOn:
    id: 'room-rules'
- extendedWaitUntil:
    visible:
      id: 'room-rate-rule'
      text: 'You can post up to 10 times an hour in each room\.'
    timeout: 15000
- tapOn:
    id: 'room-rules-ok'
- extendedWaitUntil:
    notVisible:
      id: 'room-rate-rule'
    timeout: 15000

# A post with a photo.
- tapOn:
    id: 'room-attach'
- extendedWaitUntil:
    visible:
      id: 'room-attach-photo'
    timeout: 15000
- tapOn:
    id: 'room-attach-photo'
- runFlow:
    file: subflows/pick-newest-photo.yaml
    env:
      BEHIND: 'room-send'
- extendedWaitUntil:
    visible:
      id: 'room-attachment-photo-0'
    timeout: 30000
- tapOn:
    id: 'room-input'
- inputText: 'Maestro ${output.ada.handle} shows a binder photo'
- runFlow: subflows/hide-keyboard.yaml
- tapOn:
    id: 'room-send'
- extendedWaitUntil:
    visible: 'Maestro ${output.ada.handle} shows a binder photo'
    timeout: 60000
- runScript:
    file: scripts/community.js
    env:
      EMAIL: ${output.ada.email}
      PASSWORD: ${output.ada.password}
      SLUG: americas-north-yugioh
      BODY: 'Maestro ${output.ada.handle} shows a binder photo'
      EXPECT_PHOTOS: '1'
- extendedWaitUntil:
    visible:
      id: 'room-post-${output.post.id}'
    timeout: 30000
- assertVisible:
    id: 'room-photo-0'
- takeScreenshot: community-room-photo-post

# Report Bo's post from its "⋯" sheet.
- tapOn:
    id: 'room-post-more-${output.boPost.id}'
- extendedWaitUntil:
    visible:
      id: 'room-post-report'
    timeout: 15000
- assertVisible: 'Message ${output.bo.handle}'
- assertVisible: 'Block ${output.bo.handle}'
- tapOn:
    id: 'room-post-report'
- extendedWaitUntil:
    visible:
      id: 'report-reason-SPAM'
    timeout: 60000
- tapOn:
    id: 'report-reason-SPAM'
- runFlow:
    file: subflows/scroll-down-to.yaml
    env:
      ID: 'report-confirm'
- tapOn:
    id: 'report-confirm'
- extendedWaitUntil:
    visible:
      id: 'report-sent'
    timeout: 60000
- takeScreenshot: community-report-sent
- runScript:
    file: scripts/reports.js
    env:
      ACTION: expect-report
      EMAIL: ${output.ada.email}
      PASSWORD: ${output.ada.password}
      HANDLE: ${output.bo.handle}
      REASON: SPAM
